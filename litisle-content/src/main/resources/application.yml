server:
  port: 8085

spring:
  application:
    name: litisle-content

  profiles:
    active: local

  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true

  # ================================
  # Nacos 配置中心 + 服务注册发现
  # ================================
  config:
    import:
      # 服务专属配置（Data ID: litisle-content.yaml）
      - optional:nacos:${spring.application.name}.yaml
      # 公共共享配置模板（Data ID: litisle-shared.yaml）
      - optional:nacos:litisle-shared.yaml
  cloud:
    nacos:
      # 连接信息：环境特定值在 application-local/dev.yaml 的 litisle.nacos 中定义
      server-addr: ${litisle.nacos.server-addr:localhost:8848}
      username: ${litisle.nacos.username:nacos}
      password: ${litisle.nacos.password:nacos}
      discovery:
        namespace: ${litisle.nacos.namespace:}
        group: ${litisle.nacos.group:DEFAULT_GROUP}
      config:
        namespace: ${litisle.nacos.namespace:}
        group: ${litisle.nacos.group:DEFAULT_GROUP}
        file-extension: yaml

  # ================================
  # MySQL 数据源配置（litisle_content 库：article/article_draft/tag/book 等 8 张表）
  # 字符集配置与 file 模块同口径（utf8mb4，防中文乱码）
  # ================================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${litisle.db.host:localhost}:${litisle.db.port:3306}/${litisle.db.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
    username: ${litisle.db.username:root}
    password: ${litisle.db.password:123}

  # ================================
  # Redis 单机配置（限流计数 / 推荐流缓存 / 冗余计数缓冲）
  # ================================
  data:
    redis:
      host: ${litisle.redis.host:localhost}
      port: ${litisle.redis.port:6380}
      password: ${litisle.redis.password:123}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 0

  # ================================
  # RabbitMQ（发送 content.submitted / content.unpublished；
  # 消费审核结果驱动 article 状态流转 1→2/1→3）
  # 账号/vhost 与 docker/init/rabbitmq/definitions.json 保持一致（litisle / litisle_pass / /litisle）
  # ================================
  rabbitmq:
    host: ${litisle.rabbitmq.host:localhost}
    port: ${litisle.rabbitmq.port:5672}
    username: ${litisle.rabbitmq.username:litisle}
    password: ${litisle.rabbitmq.password:litisle_pass}
    virtual-host: /litisle
    listener:
      simple:
        # 手动 ACK：消费成功 ack；业务异常 nack requeue=false 入 DLQ（防毒丸消息无限重投）
        acknowledge-mode: manual
        # 消费者预取上限（防一次拉取海量消息导致内存 OOM）
        prefetch: 10

litisle:
  content:
    publish:
      # 批量发布单批上限（§6.3，ContentProperties.publish.batchMax 绑定；超限抛 ARTICLE_BATCH_EXCEEDED——防批量刷审）
      batch-max: 20
      scheduled:
        # 定时发布任务（项2 2026-11-02，ArticleScheduledPublishJob 占位符直读，非 ContentProperties 绑定）
        enabled: true                  # 任务开关（多实例部署时只开一台或靠分布式锁单点，对齐 feed.hot.refill 纪律）
        interval-ms: 60000             # 扫描周期（1min；fixedDelay 上一轮结束才计下一轮，不堆积）
        initial-delay-ms: 60000        # 启动延迟（避开启动高峰，对齐灌榜/刷回任务）
    view:
      # 浏览计数（阶段8① PV+去重窗口口径）：详情命中 INCR Redis pending 键，定时任务合并刷回 article.view_cnt
      flush:
        enabled: true                  # 刷回任务开关（多实例部署时只开一台或改用分布式锁单点，对齐 feed.hot.refill 纪律）
        interval-ms: 300000            # 刷回周期（5min；fixedDelay 上一轮结束才计下一轮，不堆积）
        initial-delay-ms: 60000        # 启动延迟（避开启动高峰，对齐灌榜任务）
      dedup-ttl-seconds: 86400         # 去重窗口 TTL（24h；窗口期内同一访问者重复进入不计数，防刷）    
    feed:
      # 无限刷流召回模式（批次十：P0 只实现数据库四路；配置为 es 时服务端告警并按 db 执行，
      # es 分支的前置改造与切换阈值见 next_update 批次十 10.9 与 Search-Architecture §十）
      recall: db                       # db=数据库四路（默认）| es=search 模块 ES 召回（P1 占位）
      # 推荐流热度榜（阶段14 切流；social 未落地期间 like/comment 恒 0，榜=浏览量+时间衰减排序）
      hot:
        enabled: true                  # 总开关（false 则 /feed 退回时间倒序直查）
        top-n: 200                     # 榜容量上限（灌榜裁剪保留 top N，防 ZSet 无界增长）
        refill-enabled: true           # 灌榜任务开关（多实例部署时只开一台，对齐 view.flush 纪律）
        refill-interval-ms: 300000     # 灌榜周期（5min 增量灌榜为主，水位增量 ZADD；距上次全量 ≥ full-refill-interval-ms(默认1h) 才走全量重算+影子键 rename 原子换榜）
        refill-initial-delay-ms: 60000 # 启动延迟
        # 权重/衰减参数走 ContentProperties 默认值（like=3/comment=2/view=0.2/decay=1.5/offset=2），
        # social 落地后按真实互动效果在此热调（无需发版）
      # 无限刷流（批次十 10.3 文章流 / 10.4 书籍流）：召回池/融合权重/快照/曝光参数（ContentProperties.feed.stream 绑定）
      stream:
        pool-size: 300                 # 召回池总上限（写入 Redis 快照的最大条数）
        recall-limit-per-path: 100     # 每路召回条数（最热/最新/常看分区/常看分类各取多少）
        snapshot-ttl-seconds: 1800     # 快照 TTL（30 分钟；过期后前端收到 reset=true）
        max-active-snapshots: 3        # 单身份最多保留的活动快照数（超出删最旧）
        exploration-ratio: 0.15        # 探索位比例（从低分段随机抽取，禁 ORDER BY RAND()）
        read-penalty: 0.5              # 已读降权扣分（已读不剔除，只降权）
        read-window-days: 30           # 已读判定窗口（天）
        fresh-half-life-hours: 24      # 新鲜度半衰期（小时）
        max-consecutive-same-author: 1 # 同作者最大连续出现条数
        max-consecutive-same-category: 2 # 同分类最大连续出现条数
        exposure-ttl-seconds: 172800   # 当日曝光 Set TTL（2 天，跨日残留不影响次日）
        new-book-days: 7               # 新书保底窗口（天）
        new-book-quota: 6              # 新书保底曝光配额（每个快照前排保证出现的新书条数）
        profile-sample-size: 100       # 画像样本条数（reading_history 取最近多少条聚合偏好）
        # 文章流四项融合权重（热度/新鲜度/分区匹配/分类匹配）
        article-weights:
          heat: 0.35                   # 热度权重（复用 FeedHotRankSupport 分数）
          fresh: 0.30                  # 新鲜度权重
          zone: 0.10                   # 分区匹配权重
          category: 0.20               # 分类匹配权重
        # 书籍流四项融合权重（收藏/阅读人数/新鲜度/完结偏好；两个计数先 log1p 归一化）
        book-weights:
          collect: 0.4                 # 收藏数权重
          read: 0.3                    # 阅读人数权重
          fresh: 0.2                   # 新鲜度权重
          finish: 0.1                  # 完结偏好权重
    moderation:
      # 审核结果回写消费参数（板块三 3-5，ContentProperties.moderation 绑定）
      last-hash-ttl-hours: 72        # last-hash 免审键 TTL（小时，与 review 结果缓存同窗防口径漂移）
      ttl-jitter-ratio: 0.1          # TTL ±10% 抖动，防同批键同刻过期雪崩
      retry:
        max-count: 5                 # 消费延迟重试上限，耗尽 nack 入 DLQ 兑底
        base-delay-ms: 30000         # 指数退避基数（30s→60s→120s→240s→480s）
    outbox:
      # 事件发件箱（批次3 2026-11-02，EventOutboxResendJob 占位符直读，非 ContentProperties 绑定）：
      # ContentEventProducer 发送前落 event_outbox 表，发送失败/进程崩溃由本任务兜底重发，保证事件必达
      resend-enabled: true           # 重发任务开关（多实例部署时靠分布式锁单点，对齐 feed.hot.refill 纪律）
      resend-interval-ms: 60000      # 重发扫描周期（1min，fixedDelay 不堆积）
      initial-delay-ms: 60000        # 启动延迟（避开启动高峰）
      max-retry-count: 5             # 单行重发次数上限，超限置放弃态（status=3）留痕人工介入
      resend-batch-size: 200         # 单轮重发批量上限（超限部分下一轮自然消化）
      retain-days: 7                 # 已发送行保留天数，过期物理清理防表无界增长
  security:
    anonymous:
      paths:
        - /api/content/article/list
        - /api/content/article/{id}
  xss:
    enabled: true                      # 是否启用 XSS 过滤
    exclude-paths:                     # 富文本接口排除路径
      - /api/content/article/publish
      - /api/content/comment/rich

# ================================
# MyBatis-Plus 配置
# default-enum-type-handler：实体枚举字段（ZoneEnum/ArticleStatusEnum/VisibilityEnum 等）
# 依赖 @JsonValue/IntDictEnum 自动映射，勿删
# ================================
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
      # del_flag 逻辑删除（板块一 [1.1]）：全局按字段名 delFlag 匹配，仅对含该字段的实体生效
      # （article/book/tag 三表，其余 5 表无 del_flag 列不受影响）；
      # 业务 CAS 仍须显式补 del_flag=0（对齐 status.md 通用纪律），此处为 MP 层兜底
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# ================================
# Knife4j API 文档配置
# ================================
knife4j:
  enable: true
  openapi:
    title: litisle-content 接口文档
    description: "Litisle-content：文章/草稿/书籍/标签/推荐流/阅读进度"
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.litisle.litislecontent.controller

# ====== 日志配置 ======
logging:
  level:
    com.litisle.litislecontent: debug
    com.litisle.litisleapi.feign: DEBUG
  pattern:
    dateformat: HH:mm:ss:SSS
    # 控制台日志格式（%X{traceId} 输出链路追踪 ID）
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{50} - %msg%n"
  file:
    path: "logs/${spring.application.name}"