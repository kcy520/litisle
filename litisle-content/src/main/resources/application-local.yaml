# ================================
# Sentinel 本地心跳端口
# 同机多服务需错开：auth 8719 / user 8720 / file 8721 / review 8722 / content 8723
# dashboard 地址在 Nacos 共享配置 litisle-shared.yaml 统一维护
# ================================
spring:
  cloud:
    sentinel:
      transport:
        port: 8723
      # ================================
      # Sentinel 规则 Nacos 数据源（选型定稿：规则属运营参数，外置 Nacos/热更新/重启不丢）
      # 规则实体 JSON 由运维/开发在 Nacos 控制台维护（dataId 见下），
      # Dashboard 仅作观测入口；资源名以启动后 Dashboard「簇点链路」为准
      # ================================
      datasource:
        degrade-rules:
          nacos:
            server-addr: ${litisle.nacos.server-addr}
            username: ${litisle.nacos.username}
            password: ${litisle.nacos.password}
            # content 专属降级规则（防与 file 的 dataId 冲突）
            data-id: litisle-content-degrade-rules.json
            group-id: DEFAULT_GROUP
            rule-type: degrade

litisle:
  # ================================
  # Nacos 配置（本地环境：宿主机映射端口 8848）
  # ================================
  nacos:
    server-addr: localhost:8848
    username: nacos
    password: nacos
    namespace: ''
    group: DEFAULT_GROUP

  # ================================
  # MySQL 配置（IDEA 本地运行：连宿主机映射端口）
  # 注意：docker-compose.yml 中业务数据库宿主机端口是 3307
  # ================================
  db:
    host: localhost
    port: 3307
    # content 业务库（article/article_draft/article_image/article_tag/book/book_chapter/reading_progress/tag）
    database: litisle_content
    username: test_k.1
    # 本地环境字面值（与 compose .env 中 COMPOSE_MYSQL_PASSWORD 保持一致，改 .env 时需同步此处）
    password: 123

  # ================================
  # Redis 配置（IDEA 本地运行：使用宿主机映射端口）
  # 注意：docker-compose.yml 中 Redis 宿主机端口是 6380
  # ================================
  redis:
    host: localhost
    port: 6380
    # 本地环境字面值（与 compose .env 中 COMPOSE_REDIS_PASSWORD 保持一致，改 .env 时需同步此处）
    password: 123

  # ================================
  # SeaweedFS 配置（IDEA 本地运行：使用宿主机映射端口）
  # 【当前未启用】content 仅存 fileId，文件读写一律经 file 服务 Feign 间接完成，
  # 不直连 SeaweedFS；若将来需要直连再取消注释
  # ================================
#  seaweed:
#    host: localhost
#    s3-port: 8333
#    # Filer HTTP 端口（公开直链拼接用，与 compose 端口映射 8888 一致）
#    filer-port: 8888

  # ================================
  # SeaweedFS S3 凭证（【当前未启用】file 模块专属，content 不持有 S3 凭证；
  # 原样注释保留，若将来 content 直连对象存储再启用）
  # ================================
#  file:
#    seaweedfs:
#      access-key: file_ak
#      secret-key: file_sk