litisle:
  # ================================
  # Nacos 配置（Docker 环境：使用容器名）
  # 容器名：litisle-nacos，容器内端口 8848
  # ================================
  nacos:
    server-addr: litisle-nacos:8848
    username: nacos
    password: nacos
    namespace: ''
    group: DEFAULT_GROUP

  # ================================
  # MySQL 配置（Docker 环境：使用容器名）
  # 容器名：litisle-mysql，容器内端口 3306
  # ================================
  db:
    host: litisle-mysql
    port: 3306
    # content 业务库（article/article_draft/article_image/article_tag/book/book_chapter/reading_progress/tag）
    database: litisle_content
    username: test_k.1
    password: ${COMPOSE_MYSQL_PASSWORD:123}

  # ================================
  # Redis 配置（Docker 环境：使用容器名）
  # 容器名：litisle-redis，容器内端口 6379
  # ================================
  redis:
    host: litisle-redis
    port: 6379
    password: ${COMPOSE_REDIS_PASSWORD:123}

  # ================================
  # SeaweedFS 配置（Docker 环境：使用容器名）
  # 【当前未启用】content 仅存 fileId，文件上传/直链/预签名一律经 file 服务 Feign 间接读写，
  # 不直连 SeaweedFS；若将来需要直连（如批量取图优化）再取消注释
  # ================================
#  seaweed:
#    host: litisle-seaweedfs
#    s3-port: 8333
#    # Filer HTTP 端口（公开直链拼接用，容器间同端口 8888）
#    filer-port: 8888