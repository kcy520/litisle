server:
  port: 8083

spring:
  application:
    name: litisle-file

  profiles:
    active: local

  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true

  # ================================
  # Multipart 上传限制（文件模块核心配置）
  # Spring Boot 默认 max-file-size=1MB / max-request-size=10MB，必须显式覆盖
  # - max-file-size：与业务单文件上限（litisle.file.upload.max-image-size = 10MB）对齐，
  #   双层校验：Servlet 层拦超大请求，Service 层拦 MIME 白名单
  # - max-request-size：批量上传上限 9 张 × 10MB + 表单字段开销，取 100MB
  #  一般业界共识是：超过 100MB 就算大文件，超过 1GB 必须走流式+断点续传。
  # ================================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  # ================================
  # Nacos 配置中心 + 服务注册发现
  # ================================
  config:
    import:
      # 服务专属配置（Data ID: litisle-file.yaml）
      - optional:nacos:${spring.application.name}.yaml
      # 公共共享配置模板（Data ID: litisle-shared.yaml，与 common 模块无关）
      - optional:nacos:litisle-shared.yaml
  cloud:
    nacos:
      # 连接信息：环境特定值在 application-local/dev.yaml 的 litisle.nacos 中定义
      server-addr: ${litisle.nacos.server-addr:localhost:8848}
      username: ${litisle.nacos.username:nacos}
      password: ${litisle.nacos.password:nacos}
      discovery:
        namespace: ${litisle.nacos.namespace:}
        group: ${litisle.nacos.group:DEFAULT_GROUP}
      config:
        namespace: ${litisle.nacos.namespace:}
        group: ${litisle.nacos.group:DEFAULT_GROUP}
        file-extension: yaml

  # ================================
  #  MySQL 数据源配置（litisle_file 库：file_meta 元数据表）
  # ================================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 字符集：characterEncoding 用大写 UTF-8，并追加 connectionCollation 强制 utf8mb4，
    # 防止 Connector/J 8.x 回退到默认 latin1 导致中文乱码
    url: "jdbc:mysql://${litisle.db.host:localhost}:${litisle.db.port:3306}/${litisle.db.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
    username: ${litisle.db.username:root}
    password: ${litisle.db.password:123}

  # ================================
  # Redis 单机配置（去重锁 / 元数据缓存）
  # ================================
  data:
    redis:
      host: ${litisle.redis.host:localhost}
      port: ${litisle.redis.port:6380}
      password: ${litisle.redis.password:123}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 0

  # ================================
  # RabbitMQ（审核结果消费：moderation.result / moderation.appeal.result）
  # 账号/vhost 与 docker/init/rabbitmq/definitions.json 保持一致（litisle / litisle_pass / /litisle）
  # ================================
  rabbitmq:
    host: ${litisle.rabbitmq.host:localhost}
    port: ${litisle.rabbitmq.port:5672}
    username: ${litisle.rabbitmq.username:litisle}
    password: ${litisle.rabbitmq.password:litisle_pass}
    virtual-host: /litisle
    listener:
      simple:
        # 手动 ACK：消费成功 ack；业务异常 nack requeue=false 入 DLQ（防毒丸消息无限重投）
        acknowledge-mode: manual
        # 消费者预取上限（防一次拉取海量消息导致内存 OOM）
        prefetch: 10

# ================================
# MyBatis-Plus 配置
# ================================
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto

# ================================
# 日志配置
# ================================
logging:
  level:
    com.litisle.litislefile: debug
    com.litisle.litisleapi.feign: DEBUG
  pattern:
    dateformat: HH:mm:ss:SSS
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{50} - %msg%n"
  file:
    path: "logs/${spring.application.name}"

# ================================
# Actuator 监控端点（暴露 RedisGuard 指标给 Prometheus）
# ================================
management:
  endpoints:
    web:
      exposure:
        # health：健康检查；prometheus：指标抓取端点（RedisGuard 熔断降级指标数据源）
        include: health,prometheus
  metrics:
    tags:
      # 指标附加服务名标签，Prometheus 多服务区分数据来源
      application: ${spring.application.name}

# ================================
# litisle-file 业务配置
# ================================
litisle:
  file:
    # SeaweedFS S3 兼容配置（对接 Filer 的 S3 网关）
    seaweedfs:
      # S3 网关地址（Filer S3 API 默认端口 8333）
      # ⚠️ SDK 内部地址：上传/删除/预签名用，不等于给前端的公开直链地址
      endpoint: http://${litisle.seaweed.host:localhost}:${litisle.seaweed.s3-port:8333}
      # 公开直链拼接基址（给前端用）
      # ⚠️ 必须指向 Filer HTTP 端口（默认 8888）而非 S3 网关（8333）：
      #   S3 端口要求 SigV4 签名，浏览器匿名 GET 会 403；Filer 天然支持匿名 GET
      # ⚠️ Filer 侧 S3 桶统一挂在 /buckets/ 目录下，故基址须含 /buckets 前缀：
      #   完整直链 = {public-url-base}/{bucket}/{path} = .../buckets/avatar/2026/09/25/xxx.jpg
      # 接 CDN 后改为 CDN 域名（如 https://img.litisle.com，回源同理指向 Filer /buckets）
      public-url-base: http://${litisle.seaweed.host:localhost}:${litisle.seaweed.filer-port:8888}/buckets
      # S3 访问凭证（与 docker/init/seaweedfs/s3.json 中 file-service 身份保持一致）
      # s3.json 里写死了 accessKey / secretKey
      # 生产环境通过环境变量 LITISLE_S3_ACCESS_KEY / LITISLE_S3_SECRET_KEY 覆盖
      access-key: ${LITISLE_S3_ACCESS_KEY:file_ak}
      secret-key: ${LITISLE_S3_SECRET_KEY:file_sk}
      # 预签名短时效 URL 有效期（分钟）：私有文件（授权文件等）鉴权下载
      presign-expire-minutes: 30
      # 业务 collection 划分（对应 Volume Server replication=001 副本策略）
      collections:
        # 键 = BizTypeEnum.code（字面量匹配，不享受宽松绑定），值 = bucket 名
        avatar: avatar
        cover: cover
        article: article
        license: license
    # 上传限制：限制图片大小（字节，默认 10MB）
    upload:
      max-image-size: 10485760
      # per-user 存储配额（软限：sha256 锁内写库前校验，超限抛 FILE_QUOTA_EXCEEDED）
      # max-total-size：单用户已用总容量上限（字节，默认 200MB）
      max-total-size: 209715200
      # max-file-count：单用户已用文件数上限（默认 200）
      max-file-count: 200
    # 缩略图配置（头像/封面场景按需生成）
    thumbnail:
      enabled: true
      width: 300
      height: 300
    # 文件对账定时任务（每日凌晨执行；多实例靠 Redisson 锁互斥，仅一个实例执行）
    reconcile-task:
      # cron 表达式（每日 02:00）
      # ⚠️ 此 key 由 FileReconcileTask 的 @Scheduled 占位符读取（注解要求编译期常量，无法走 Bean 注入）
      # Nacos 共享配置可直接覆盖此值调整执行频率
      cron: 0 0 2 * * ?
      # Step1 补偿阈值（分钟）：status=0 占位记录超此时间进入对账扫描
      compensate-threshold-minutes: 30
      # Step2 软删缓冲期（天）：del_flag=1 超此时间才物理清理（防误删不可恢复）
      physical-clean-delay-days: 7
      # Step2 隔离前缀：path 以此开头的记录跳过物理清理
      # 违规图保留期由 moderation 侧（litisle.moderation.quarantine.retention-days，当前=10 天）控制，
      # 防 file 侧 7 天清理提前删除违规图证据、致申诉无法复核（两套保留期打架）
      quarantine-prefix: quarantine/
      # 「file 侧跳过隔离清理」开关：默认 true；置 false 时退回 file 侧保留期口径（仅调试用）
      skip-quarantine-cleanup: true
    # 文件 IO 线程池：上传/下载阻塞 IO 隔离（下载走 StreamingResponseBody，由该池执行）
    # 慢客户端不再占用 Tomcat 工作线程，防止主线程池被打满
    executor:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 64
      keep-alive-seconds: 60
      # 异步请求超时（秒）：大文件下载耗时，需放宽（默认 30s 会截断）
      async-timeout-seconds: 600
    # 限流阈值（运营可调，Nacos 共享配置可覆盖）
    # 全站 QPS：所有 /api/file/** 合计上限，防全站洪峰打爆 Tomcat/SeaweedFS 后端
    limit:
      # 时间窗口（秒）
      global-qps-window-seconds: 1
      # 窗口内最大请求数（全站合计）
      global-qps-max-count: 200

    moderation:
      # 图片机审 provider（审核结果缓存 key 版本段）
      # ⚠️ 必须与 review 侧 image-provider 配置一致，不一致 → 缓存 key 漂移、上传前置检查永不命中
      image-provider: onnx
      # 图片机审模型版本（同上，与 review 侧保持一致）
      image-model-version: v1
      # PUBLIC 高曝光面待审/存疑占位图（前端静态资源相对路径）
      pending-placeholder-url: /img/file-pending.svg

# ================================
# Knife4j API 文档配置
# ================================
knife4j:
  enable: true
  openapi:
    title: litisle-file 接口文档
    description: "Litisle-file：SeaweedFS 文件接入（上传/直链/预签名/删除）"
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.litisle.litislefile.controller