litisle:
  # ================================
  # Nacos 配置（Docker 环境：使用容器名）
  # 容器名：litisle-nacos，容器内端口 8848
  # ================================
  nacos:
    server-addr: litisle-nacos:8848
    username: nacos
    password: nacos
    namespace: ''
    group: DEFAULT_GROUP

  # ================================
  # MySQL 配置（Docker 环境：使用容器名）
  # 容器名：litisle-mysql，容器内端口 3306
  # ================================
  db:
    host: litisle-mysql
    port: 3306
    database: litisle_file
    username: test_k.1
    password: ${COMPOSE_MYSQL_PASSWORD:123}

  # ================================
  # Redis 配置（Docker 环境：使用容器名）
  # 容器名：litisle-redis，容器内端口 6379
  # ================================
  redis:
    host: litisle-redis
    port: 6379
    password: ${COMPOSE_REDIS_PASSWORD:123}

  # ================================
  # SeaweedFS 配置（Docker 环境：使用容器名）
  # 容器名按 docker-compose.yml 中实际服务名填写
  # ================================
  seaweed:
    host: litisle-seaweedfs
    s3-port: 8333