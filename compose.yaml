# ============================================================================
# Litisle 项目 Docker Compose 配置
# ============================================================================
# 包含：MySQL、Redis
# 使用方法：docker-compose up -d
# 停止服务：docker-compose down
# 查看日志：docker-compose logs -f [服务名]
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # MySQL - 业务数据库
  # 宿主机端口：3307 → 容器端口：3306
  # 连接示例：
  #   jdbc:mysql://localhost:3309/litisle_db
  #   root / verysecret
  #   test_k.1 / 123
  # --------------------------------------------------------------------------
  litisle-mysql:
    image: mysql:8.0
    container_name: litisle-mysql
    networks:
      - litisle-network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${COMPOSE_MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init/mysql:/docker-entrypoint-initdb.d
      # Nacos 官方建表脚本（创建 nacos_config 库及全部表，首次初始化时执行）
      - ./docker/init/nacos/mysql-schema.sql:/docker-entrypoint-initdb.d/10-nacos-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Redis - 缓存服务
  # 宿主机端口：6380 → 容器端口：6379
  # 连接示例：
  #   redis://localhost:6380
  #   密码：123
  # --------------------------------------------------------------------------
  litisle-redis:
    image: redis:7-alpine
    container_name: litisle-redis
    networks:
      - litisle-network
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --requirepass ${COMPOSE_REDIS_PASSWORD}
      --appendonly yes
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Nacos - 服务注册与配置中心
  # 控制台地址：http://localhost:8848/nacos  默认账号：nacos/nacos
  # 说明：复用 litisle-mysql 实例，nacos_config 库由 10-nacos-schema.sql 创建
  #       鉴权相关变量见 .env（docker/init/nacos/mysql-schema.sql）
  # --------------------------------------------------------------------------
  litisle-nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: litisle-nacos
    networks:
      - litisle-network
    environment:
      # 单机模式 + MySQL 存储
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=litisle-mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=${MYSQL_USER}
      - MYSQL_SERVICE_PASSWORD=${COMPOSE_MYSQL_PASSWORD}
      # 鉴权配置（token 需为 base64 且至少 32 字节）
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_KEY:-serverIdentity}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_VALUE:-security}
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN}
      # JVM 内存控制
      - JVM_XMS=256m
      - JVM_XMX=512m
      - JVM_XMN=128m
    ports:
      - "8848:8848"   # 控制台 HTTP
      - "9848:9848"   # gRPC 通信端口
    depends_on:
      litisle-mysql:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Sentinel Dashboard - 流控/熔断控制台（obs 组，按需启动）
  # 控制台地址：http://localhost:8090
  # 启动方式：docker compose --profile obs up -d litisle-sentinel
  # --------------------------------------------------------------------------
  litisle-sentinel:
    build:
      context: ./docker/init/sentinel
      dockerfile: Dockerfile
    image: sentinel-dashboard:1.8.9
    container_name: litisle-sentinel
    profiles:
      - obs
    networks:
      - litisle-network
    environment:
      # SERVER_PORT：Spring Boot 原生识别的环境变量，确保容器内监听端口与映射一致
      - SERVER_PORT=8090
    ports:
      - "8090:8090"
    restart: unless-stopped

# ============================================================================
# 网络配置
# ============================================================================
networks:
  litisle-network:
    driver: bridge

# ============================================================================
# 数据卷配置（持久化）
# ============================================================================
volumes:
  mysql-data:
  redis-data:


