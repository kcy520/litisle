# ============================================================================
# Litisle 项目 Docker Compose 配置
# ============================================================================
# 包含：MySQL、Redis、Nacos、Sentinel(obs)、Seata、RabbitMQ、Elasticsearch、Kibana(es)、Infinity(ai)
# 使用方法：docker-compose up -d
# 停止服务：docker-compose down
# 查看日志：docker-compose logs -f [服务名]
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # MySQL - 业务数据库
  # 宿主机端口：3307 → 容器端口：3306
  # 连接示例：
  #   jdbc:mysql://localhost:3309/litisle_db
  #   root / verysecret
  #   test_k.1 / 123
  # --------------------------------------------------------------------------
  litisle-mysql:
    image: mysql:8.0
    container_name: litisle-mysql
    networks:
      - litisle-network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${COMPOSE_MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init/mysql:/docker-entrypoint-initdb.d
      # Nacos 官方建表脚本（创建 nacos_config 库及全部表，首次初始化时执行）
      - ./docker/init/nacos/mysql-schema.sql:/docker-entrypoint-initdb.d/10-nacos-schema.sql:ro
      # （Seata 建表脚本无需单独挂载：docker/init/mysql/02-seata-schema.sql 随目录挂载自动执行）
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Redis - 缓存服务
  # 宿主机端口：6380 → 容器端口：6379
  # 连接示例：
  #   redis://localhost:6380
  #   密码：123
  # --------------------------------------------------------------------------
  litisle-redis:
    image: redis:7-alpine
    container_name: litisle-redis
    networks:
      - litisle-network
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --requirepass ${COMPOSE_REDIS_PASSWORD}
      --appendonly yes
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Nacos - 服务注册与配置中心
  # 控制台地址：http://localhost:8080 （Nacos 3 独立控制台，默认账号：nacos/nacos）
  # 说明：复用 litisle-mysql 实例，nacos_config 库由 10-nacos-schema.sql 创建
  #       数据库连接使用 Nacos 专用账号（NACOS_DB_USER，最小权限仅 nacos_config 库）
  #       鉴权相关变量见 .env（docker/init/nacos/mysql-schema.sql）
  # --------------------------------------------------------------------------
  litisle-nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: litisle-nacos
    networks:
      - litisle-network
    environment:
      # 单机模式 + MySQL 存储
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=litisle-mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos_config
      # Nacos 专用账号（不与业务账号混用）：需有 nacos_config 库的 DDL 权限，3.x 启动迁移器要建表
      - MYSQL_SERVICE_USER=${NACOS_DB_USER}
      - MYSQL_SERVICE_PASSWORD=${NACOS_DB_PASSWORD}
      # 跳过 2.x→3.x 命名空间兼容性预检（官方临时方案，新集群适用）：
      # 已知缺陷，空库/单库权限下也会误报 config_info namespace migrate pre check failed
      # 详见 alibaba/nacos#13488、#13569、#15172
      - NACOS_CONFIG_NAMESPACE_COMPATIBLE_MODE=false
      # 鉴权配置（token 需为 base64 且至少 32 字节）
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_KEY:-serverIdentity}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_VALUE:-security}
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN}
      # JVM 内存控制
      - JVM_XMS=256m
      - JVM_XMX=512m
      - JVM_XMN=128m
    ports:
      - "8848:8848"   # Nacos 3：仅 API/gRPC（控制台已拆分到 8080）
      - "9848:9848"   # gRPC 通信端口
      - "8080:8080"   # Nacos 3：独立控制台 http://localhost:8080
    depends_on:
      litisle-mysql:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Sentinel Dashboard - 流控/熔断控制台（obs 组，按需启动）
  # 控制台地址：http://localhost:8090
  # 启动方式：docker compose --profile obs up -d litisle-sentinel
  # --------------------------------------------------------------------------
  litisle-sentinel:
    build:
      context: ./docker/init/sentinel
      dockerfile: Dockerfile
    image: sentinel-dashboard:1.8.9
    container_name: litisle-sentinel
    profiles:
      - obs
    networks:
      - litisle-network
    environment:
      # SERVER_PORT：Spring Boot 原生识别的环境变量，确保容器内监听端口与映射一致
      - SERVER_PORT=8090
    ports:
      - "8090:8090"
    restart: unless-stopped
    # 容器在退出时自动重启，除非你手动 stop 过它。

  # --------------------------------------------------------------------------
  # Prometheus - 监控指标拉取端（obs 组，按需启动，与 Sentinel 同纪律）
  # 控制台地址：http://localhost:9090（验证入口 /targets 与 Graph）
  # 启动方式：docker compose --profile obs up -d litisle-prometheus
  # 说明：直连宿主机各服务 8xxx 端口抓取 /actuator/prometheus，不经网关（免认证拦截）；
  #       容器内必须用 host.docker.internal 不能写 localhost（抓的是宿主机上的服务进程）；
  #       与 Java 侧 micrometer-registry-prometheus（Boot BOM 托管）走 HTTP 文本协议，无版本耦合
  # --------------------------------------------------------------------------
  litisle-prometheus:
    image: prom/prometheus:v3.4.1
    container_name: litisle-prometheus
    profiles:
      - obs
    networks:
      - litisle-network
    ports:
      - "9090:9090"
    volumes:
      - ./docker/init/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 告警规则文件：rule_files 是容器内路径，必须把规则文件也挂进去，否则 glob 匹配不到会静默加载 0 条规则
      - ./docker/init/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Alertmanager - 告警通知端（obs 组，按需启动，与 Prometheus 同纪律）
  # 控制台地址：http://localhost:9093
  # 说明：接收 Prometheus rule_files 评估出的告警（见 prometheus.yml alerting 段）；
  #       当前 alertmanager.yml 仅含 dev-null 接收器（告警只落控制台不外发），
  #       后续接邮件/钉钉等通知渠道时只需改该文件并重启容器，零代码改动
  # --------------------------------------------------------------------------
  litisle-alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: litisle-alertmanager
    profiles:
      - obs
    networks:
      - litisle-network
    ports:
      - "9093:9093"
    volumes:
      - ./docker/init/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Seata TC Server - 分布式事务协调者（AT 模式，积分商城扣款+下单强一致性依赖它）
  # 控制台地址：http://localhost:7091 （默认账号：seata / seata）
  # TC 服务端口：8091（客户端连接）
  # 说明：复用 litisle-mysql 实例，seata_server 库由 30-seata-schema.sql 创建
  #       数据库连接使用 Seata 专用账号（SEATA_DB_USER，最小权限仅 seata_server 库）
  #       服务注册到 litisle-nacos，客户端通过服务发现连接 TC
  # --------------------------------------------------------------------------
  litisle-seata:
    build:
      context: ./docker/init/seata
      dockerfile: Dockerfile
    image: seata-server:2.5.0
    container_name: litisle-seata
    networks:
      - litisle-network
    # 官方 2.5.0 镜像启动脚本未将 SEATA_IP 转为 JVM 参数（实测进程参数无 -Dseata.ip），
    # 导致 TC 仍以容器内网 IP（172.x）注册进 Nacos，宿主机客户端不可达。
    # 【规范做法】不覆盖 entrypoint，交由镜像自带 /seata-server-entrypoint.sh 启动。
    # 该镜像由 Jib 构建（classes/ + libs/ + jib-classpath-file，无独立 fat jar），
    # 覆盖为 java -jar 必然失败；注册 IP 按官方文档由环境变量 SEATA_IP 注入（见下方 environment）。
    # ---------建议删除以下 7 行注释（旧 entrypoint 覆盖方案说明，随本次改造废弃）---------
    # 此处覆盖 entrypoint：按镜像原始启动参数原样重建，额外注入 -Dseata.ip
    # （等价于启动脚本对 SEATA_IP 的预期处理，见官方文档 SEATA_IP 说明）
    # 自动定位主 jar（官方镜像主 jar 在 /seata-server/ 下但路径随版本变动，依赖包在
    # /seata-server/libs；-Dloader.path=/lib 加载自定义 jdbc 驱动，与原镜像 Dockerfile 对应）
    # $ 是 compose 转义写法：容器 shell 收到单个 $，由容器内在运行时求值
    # 用命令替换内联定位主 jar，不引入 shell 变量（compose 只插值美元变量，命令替换原样透传）；
    # IP 经 compose 从 .env 解析后写入，全程无需双美元转义，规避转义被还原导致的空串问题。
    environment:
      - SEATA_DB_USER=${SEATA_DB_USER}
      - SEATA_DB_PASSWORD=${SEATA_DB_PASSWORD}
      # TC 注册到 Nacos 的 IP：默认取容器内网 IP（172.x），宿主机上的客户端不可达。
      # 指定为 Windows 宿主机局域网 IP（.env 中 SEATA_IP 配置，如 192.168.31.x），
      # 配合 8091 端口映射，客户端经 Nacos 发现后直连宿主机端口（官方 FAQ #31：
      # TC 与业务服务不同网络时注册地址需指定为 NAT/主机 IP）
      - SEATA_IP=${SEATA_IP}
    ports:
      - "7091:7091"   # 控制台
      - "8091:8091"   # TC 服务端口
    volumes:
      - ./docker/init/seata/application.yml:/seata-server/resources/application.yml
    depends_on:
      litisle-mysql:
        condition: service_healthy
      litisle-nacos:
        condition: service_started
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # RabbitMQ - 消息队列（带延迟消息插件 rabbitmq_delayed_message_exchange 3.13.0）
  # 管理界面：http://localhost:15672 （账号：litisle / litisle_pass）
  # AMQP 端口：5672；业务 vhost：/litisle
  # 说明：账号/vhost 由 definitions.json 硬编码（management.load_definitions 加载，
  #       会覆盖 RABBITMQ_DEFAULT_* 环境变量，故不配环境变量，以 definitions.json 为唯一真相源）
  # --------------------------------------------------------------------------
  litisle-rabbitmq:
    build:
      context: ./docker/init/rabbitmq
      dockerfile: Dockerfile
    image: rabbitmq:3.13-with-delayed-exchange
    container_name: litisle-rabbitmq
    networks:
      - litisle-network
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # 管理界面
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Elasticsearch - 搜索引擎（带 IK 中文分词插件 8.18.8，与 elasticsearch-java 客户端同版本）
  # 连接地址：http://localhost:9200 （开发环境已关闭安全认证）
  # 说明：litisle-search 模块使用；IK 插件由 Dockerfile 构建时装入，版本必须与镜像严格一致
  #       首次启动注意：WSL2 需先执行 sudo sysctl -w vm.max_map_count=262144（重启后失效，
  #       可写入 /etc/sysctl.conf 持久化），否则报 max virtual memory areas 错误
  # --------------------------------------------------------------------------
  litisle-elasticsearch:
    build:
      context: ./docker/init/elasticsearch
      dockerfile: Dockerfile
    image: elasticsearch:8.18.8-ik
    container_name: litisle-elasticsearch
    networks:
      - litisle-network
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.name=litisle-es-cluster
    ports:
      - "9200:9200"   # REST API
      - "9300:9300"   # 节点通信（单节点预留）
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Kibana - ES 可视化管理界面（es 组，按需启动，避免常驻占内存）
  # 控制台地址：http://localhost:5601
  # 启动方式：docker compose --profile es up -d litisle-kibana
  # --------------------------------------------------------------------------
  litisle-kibana:
    image: kibana:8.18.8
    container_name: litisle-kibana
    profiles:
      - es
    networks:
      - litisle-network
    environment:
      - ELASTICSEARCH_HOSTS=http://litisle-elasticsearch:9200
      - I18N_LOCALE=zh-CN
    ports:
      - "5601:5601"
    depends_on:
      litisle-elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # SeaweedFS - 分布式文件存储（开发环境单容器模式：master + volume + filer + s3 合一进程）
  # S3 API：http://localhost:8333（litisle-file 只对接此端口）
  # Filer：http://localhost:8888 ；Master UI：http://localhost:9333
  # 凭证由 docker/init/seaweedfs/s3.json 静态配置（单一真相源，同 RabbitMQ definitions.json 思路）
  # 说明：生产/联调环境切换 Master×3 + Volume×3 完整拓扑，对 litisle-file 透明（只依赖 S3 API）
  # --------------------------------------------------------------------------
  litisle-seaweedfs:
    image: chrislusf/seaweedfs:4.46
    container_name: litisle-seaweedfs
    networks:
      - litisle-network
    command: >
      server -dir=/data -master -volume -filer -s3
      -master.port=9333 -volume.port=8080 -filer.port=8888 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json -volume.max=0
    # 注：原 -filer.recycleBinMaxHours=168 已移除——该旗标为 SeaweedFS 企业版功能，
    # 开源版 4.46 无此参数（无效旗标，曾误以为有回收站兜底）；
    # 删除可恢复能力由应用层「软删 + 对账缓冲期满物理清理」承担（见 FileReconcileTask）
    ports:
      - "9333:9333"   # Master UI/API
      - "8333:8333"   # S3 API（业务入口）
      - "8888:8888"   # Filer
      - "18080:8080"  # Volume
    volumes:
      - seaweed-data:/data
      - ./docker/init/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      # Filer JWT 验签配置：写操作强制验签、读匿名保留
      # （/etc/seaweedfs 为 SeaweedFS 自动搜索路径，无需命令行参数指定）
      - ./docker/init/seaweedfs/security.toml:/etc/seaweedfs/security.toml:ro
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Infinity - 本地重排推理服务（ai 组，按需启动，与 Sentinel/Kibana 同纪律）
  # Rerank API：http://localhost:7997/rerank（litisle-ai RAG 检索精排通道）
  # 启动方式：docker compose --profile ai up -d litisle-infinity
  # 说明：加载 BAAI/bge-reranker-v2-m3（cross-encoder，权重约 2GB）；
  #       首次启动自动从 HuggingFace 下载并缓存到 infinity-data 卷（二次启动免下载），
  #       国内网络下载慢/失败时启用下方 HF_ENDPOINT 镜像站环境变量；
  #       应用侧配置 litisle.ai.rag.rerank.base-url 默认即 http://localhost:7997，
  #       yml 中 rerank.enabled=true 前必须先启动本服务（否则重排调用失败自动降级向量排序）；
  #       CPU 可跑（无 GPU 时每条候选十几 ms，topK×3 候选一次精排约 200ms）
  # --------------------------------------------------------------------------
  litisle-infinity:
    image: michaelf34/infinity:latest
    container_name: litisle-infinity
    profiles:
      - ai
    networks:
      - litisle-network
    # 国内网络拉取 HuggingFace 模型慢/失败时，启用镜像站：
    environment:
      HF_ENDPOINT: https://hf-mirror.com
    command: >
      v2 --model-id BAAI/bge-reranker-v2-m3 --port 7997 --no-bettertransformer
    ports:
      - "7997:7997"   # Rerank API
    volumes:
      # 模型权重缓存（HF_HOME），持久化后二次启动不再重复下载
      - infinity-data:/app/.cache
    healthcheck:
      # 镜像为 python slim 无 curl，用内置 python 探测 /health
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7997/health', timeout=5)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      # 首次启动含模型下载/加载，放宽探活起步时间
      start_period: 300s
    restart: unless-stopped

# ============================================================================
# 网络配置
# ============================================================================
networks:
  litisle-network:
    driver: bridge

# ============================================================================
# 数据卷配置（持久化）
# ============================================================================
volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
  seaweed-data:
  prometheus-data:
  alertmanager-data:
  infinity-data:


