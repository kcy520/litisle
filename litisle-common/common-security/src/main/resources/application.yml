## ====================================================================
## common-security 配置模板（供业务服务参考，业务服务在自己的 application.yml 中配置）
## ====================================================================
## 【说明】
## 1. common-security 是公共库，此文件仅作配置参考模板，不会直接生效
## 2. 业务服务（如 litisle-auth、litisle-user）复制所需配置到自己的 application.yml
## 3. 配置通过 Nacos 动态下发，运维可热更新，无需重启
#
#litisle:
#  security:
#    # ----------------------- 匿名访问白名单 -----------------------
#    # 【说明】配合 @Anonymous 注解使用，双重控制匿名访问
#    # 网关读取此配置跳过 JWT 校验，业务服务构建匿名 SecurityContext
#    anonymous:
#      paths:
#        - /api/auth/login           # 登录
#        - /api/auth/register        # 注册
#        - /api/auth/captcha         # 图形验证码
#        - /api/auth/oauth/**        # OAuth2 第三方登录
#        - /api/content/article/list # 公开文章列表
#        - /api/content/article/{id} # 公开文章详情
#        - /actuator/**              # 健康检查（生产环境需限制）
#
    # ----------------------- Sa-Token 配置（替代 JwtTokenProvider + DeviceSessionManager） -----------------------
    # 【重要】sa-token 是顶级配置项，不能放在 litisle.security 下（框架识别不到）
    # 此处为模板参考，业务服务复制到自己的 application.yml 时需放到顶级
    # 详见 https://sa-token.cc/doc.html#/use/config
    # 网关与业务服务共享 jwt-secret-key，确保 Token 校验一致

# ====================================================================
# Sa-Token 配置（替代 JwtTokenProvider + DeviceSessionManager）
# 【重要】sa-token 是顶级配置项，框架通过 @ConfigurationProperties(prefix = "sa-token") 绑定
# 若放在 litisle.security 下，前缀变为 litisle.security.sa-token，框架无法识别，配置失效
# 业务服务使用时，取消注释并将此段复制到自己的 application.yml 顶级
# 详见 https://sa-token.cc/doc.html#/use/config
# ====================================================================
#sa-token:
#  # Token 名称（请求头名），默认 satoken，建议改为 Authorization
#  token-name: Authorization
#  # Token 前缀（请求头中 Bearer xxx）
#  token-prefix: Bearer
#  # 是否从请求头读取 Token
#  is-read-header: true
#  # 是否将 Token 写入响应头
#  is-write-header: true
#  # Token 有效期（秒），默认 30 分钟（对应原 access-token-expire）
#  timeout: 1800
#  # 临时有效期（秒），记住我模式用，默认 7 天（对应原 remember-me-expire）
#  active-timeout: 604800
#  # 是否允许同一账号多端登录（对应原 session.is-concurrent 语义）
#  is-concurrent: true
#  # 同一账号最大登录数量（-1 = 不限，对应原 max-concurrent: 2）
#  max-login-count: 2
#  # JWT 密钥（HMAC-SHA256，至少 256 bit = 32 字符）
#  # 启用后 Token 为 JWT 格式，网关可无状态校验
#  # 生产环境通过环境变量 LITISLE_JWT_SECRET 注入，禁止硬编码
#  jwt-secret-key: ${LITISLE_JWT_SECRET:your-256-bit-secret-key-here}
#  # 是否输出操作日志
#  is-log: true
#
#    # ----------------------- 登录失败锁定策略 -----------------------
#    login:
#      # 连续失败阈值（超过则锁定账号）
#      max-fail-count: 5
#      # 锁定时长（分钟）
#      lock-minutes: 15
#
#    # ----------------------- 数据加密配置 -----------------------
#    # 【说明】AES-256-GCM 密钥配置，用于手机号/邮箱等敏感字段加密存储
#    # 生产环境通过环境变量注入，不硬编码
#    crypto:
#      # AES-256 密钥（必须 32 字符 = 256 bit）
#      key: ${LITISLE_CRYPTO_KEY:change-this-to-32-character-key-in-prod}
#      # BCrypt 强度因子（默认 10，范围 4-31，越大越安全但越慢）
#      bcrypt-cost: 10
# 像 litisle.security.crypto.key （AES 密钥）这种 具体值 ，业务服务必须在自己的 application.yml 中配置：
#
#  # ----------------------- XSS 过滤配置 -----------------------
#  # 【说明】XssFilter 默认拦截 /*，如需排除富文本接口，可在此配置
#  xss:
#    # 是否启用 XSS 过滤（默认 true）
#    enabled: true
#    # 排除路径（不进行 XSS 清洗，如富文本编辑器内容）
#    exclude-paths:
#      - /api/content/article/publish   # 文章发布（需保留 HTML）
#      - /api/content/comment/rich       # 富文本评论
#
