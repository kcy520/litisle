litisle:
  # ================================
  # Nacos 配置（Docker 环境：使用容器名）
  # 容器名：litisle-nacos，容器内端口 8848
  # ================================
  nacos:
    server-addr: litisle-nacos:8848
    username: nacos
    password: nacos
    namespace: ''
    group: DEFAULT_GROUP

  # ================================
  # MySQL 配置（Docker 环境：使用容器名）
  # 容器名：litisle-mysql，容器内端口 3306
  # ================================
  db:
    host: litisle-mysql
    port: 3306
    database: litisle_search
    username: test_k.1
    password: ${COMPOSE_MYSQL_PASSWORD:123}

  # ================================
  # Redis 配置（Docker 环境：使用容器名）
  # 容器名：litisle-redis，容器内端口 6379
  # ================================
  redis:
    host: litisle-redis
    port: 6379
    password: ${COMPOSE_REDIS_PASSWORD:123}

  # ================================
  # RabbitMQ 配置（Docker 环境：使用容器名）
  # 容器名：litisle-rabbitmq，容器内端口 5672
  # ================================
  rabbitmq:
    host: litisle-rabbitmq
    port: 5672

  # ================================
  # Elasticsearch 配置（Docker 环境：使用容器名）
  # 容器名：litisle-elasticsearch，容器内端口 9200（开发环境已关闭安全认证）
  # ================================
  es:
    hosts: litisle-elasticsearch:9200
