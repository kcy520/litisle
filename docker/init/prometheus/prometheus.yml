# ============================================================================
# Prometheus 抓取配置 - litisle 微服务监控链路（第4层：拉取端）
# 与 next_update.md 待办清单一致：job=litisle-services，直连各服务 8xxx 端口
# 注意：容器内必须用 host.docker.internal（不能写 localhost），
#       extra_hosts 的 host-gateway 映射已在 compose.yaml 中配置
# ============================================================================

global:
  scrape_interval: 15s     # 抓取周期
  evaluation_interval: 15s # 规则评估周期

# 告警规则文件（相对本文件所在目录）；规则内容见 alert-rules.yml
rule_files:
  - alert-rules.yml

# 告警推送目标：评估触发的 alert 发给 Alertmanager（compose 内容器名直连）
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - litisle-alertmanager:9093

scrape_configs:
  - job_name: litisle-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8082  # litisle-auth
          - host.docker.internal:8081  # litisle-user
          - host.docker.internal:8083  # litisle-file
          - host.docker.internal:8085  # litisle-content（批次十：推荐流降级/快照创建/画像缓存指标，管理端点与业务端口共用 8085）
          - host.docker.internal:8086  # litisle-search（批次九 9.9-B：索引同步/检索/缓存/死信指标）
          - host.docker.internal:8084  # litisle-review（批次十三：moderation_* 审核指标 + moderation_alert_threshold 阈值指标，管理端点与业务 8084 共用）