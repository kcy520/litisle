# ============================================================================
# 告警规则 - litisle 微服务
# 首条规则按清单④落地：Redis 三态熔断降级持续 5 分钟即触发
# 后续新规则直接在本文件追加，prometheus.yml 已挂载整个文件，
#   但 Prometheus 不自动热加载，需触发重载（见下方命令）
# ============================================================================

groups:
  - name: litisle-redis-guard
    rules:
      - alert: RedisGuardDegraded
        # 任一服务（auth/user/file）处于 Redis 降级态（Gauge=1）即命中
        expr: redis_guard_degraded == 1
        for: 5m            # 持续 5 分钟才触发，过滤瞬时抖动（如重启 Redis 的短暂探测期）
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.application }}] Redis 降级中，已走本地兑底限流"
          description: "实例 {{ $labels.instance }} 的 redis_guard_degraded == 1 已持续 5 分钟，限流降级为本地计数模式，请检查 Redis（compose: litisle-redis / 6380）。"

  - name: litisle-moderation
    rules:
      # ========================================================================
      # 7-3 机审六规则：阈值全部外置 §4.7 litisle.moderation.alert.*（Nacos）
      # 【阈值外置机制】阈值不写死在本文件——review 服务 AlertThresholdMetrics 把阈值
      #   暴露为阈值指标 moderation_alert_threshold{rule=...}，表达式用 on(application)
      #   向量匹配引用；改 Nacos 阈值 → 抓取端数值更新 → 告警判定即时生效，零规则文件变更
      # 【建议初值】存疑积压 50 / 在办超时 30 分钟 / DLQ 100 / 失败率 0.2 / 通过率跌幅 0.3 / 缓存命中跌幅 0.5
      # ========================================================================

      # ① 存疑积压：人审池（suspicious）持续超阈 → 审核人力不足或模型疑判率异常
      - alert: ModerationSuspiciousBacklogHigh
        expr: moderation_backlog{status="suspicious"} > on(application) moderation_alert_threshold{rule="suspicious-backlog"}
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.application }}] 存疑积压超阈（当前 {{ $value }}）"
          description: "存疑任务积压持续 5 分钟超阈值（阈值由 Nacos alert.suspicious-backlog-threshold 下发），请扩充人审运力或排查模型疑判率。"

      # ② 在办超时：认领超时回池持续发生 → 审核员认领后离线/遗忘（claim.timeout-minutes 决定回池触发线，改 Nacos 即改告警口径）
      - alert: ModerationClaimTimeoutRepooled
        expr: increase(moderation_claim_timeout_repool_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.application }}] 近 15 分钟出现认领超时回池 {{ $value }} 单"
          description: "审核员认领后超时未裁决被 sweeper 回池（回池线=Nacos sweeper.claim-timeout-minutes），持续出现说明在办任务悬死，请关注审核员在线率。"

      # ③ DLQ 堆积：死信兑底链路存量超阈 → 消费端持续故障，需人工介入转人审
      - alert: ModerationDlqBacklogHigh
        expr: moderation_dlq_backlog > on(application) moderation_alert_threshold{rule="dlq-backlog"}
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "[{{ $labels.application }}] DLQ 堆积超阈（当前 {{ $value }}）"
          description: "送审死信存量持续 5 分钟超阈值（阈值=Nacos alert.dlq-backlog-threshold），消费端重试耗尽的消息正堆积，请排查消费故障并人工转人审。"

      # ④ 机审失败率：非 pass 判定占比持续超阈 → 模型/词库质量劣化信号（分母为 0 时结果 NaN 不触发，天然防初启动误报）
      - alert: ModerationFailRateHigh
        expr: sum by (application) (rate(moderation_total{verdict!="pass"}[10m])) / sum by (application) (rate(moderation_total[10m])) > on(application) moderation_alert_threshold{rule="moderation-fail-rate"}
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "[{{ $labels.application }}] 机审失败率 {{ $value | humanizePercentage }} 持续超阈"
          description: "10 分钟窗口内 reject+suspicious 占比超阈值（阈值=Nacos alert.moderation-fail-rate），请检查模型输出/词库变更/内容源质量。"

      # ⑤ 通过率相对基线跌幅：短窗（1h）通过率相对长窗（24h）基线的相对跌幅超阈 →
      #   prompt/模型/词库变更后判定口径回滑检测（分母为 0 时 NaN 不触发）
      - alert: ModerationPassRateDropped
        expr: ((sum by (application) (rate(moderation_total{verdict="pass"}[24h])) / sum by (application) (rate(moderation_total[24h]))) - (sum by (application) (rate(moderation_total{verdict="pass"}[1h])) / sum by (application) (rate(moderation_total[1h])))) / (sum by (application) (rate(moderation_total{verdict="pass"}[24h])) / sum by (application) (rate(moderation_total[24h]))) > on(application) moderation_alert_threshold{rule="pass-rate-drop"}
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.application }}] 机审通过率相对基线跌幅 {{ $value | humanizePercentage }}"
          description: "1h 窗口通过率较 24h 基线相对跌幅超阈值（阈值=Nacos alert.pass-rate-drop-ratio），若近期有模型/prompt/词库变更请评估回滚。"

      # ⑥ 缓存命中率跌落：result 层短窗命中率相对长窗基线的相对跌幅超阈 → 省钱效果劣化
      #   （缓存失效/版本号频繁变更信号；layer=blacklist 由 file 侧上报，不参与本规则计算）
      - alert: ModerationCacheHitRateDropped
        expr: ((sum by (application) (rate(moderation_cache_hit{layer="result"}[24h])) / sum by (application) (rate(moderation_total[24h]))) - (sum by (application) (rate(moderation_cache_hit{layer="result"}[1h])) / sum by (application) (rate(moderation_total[1h])))) / (sum by (application) (rate(moderation_cache_hit{layer="result"}[24h])) / sum by (application) (rate(moderation_total[24h]))) > on(application) moderation_alert_threshold{rule="cache-hit-drop"}
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.application }}] 审核缓存命中率相对基线跌幅 {{ $value | humanizePercentage }}"
          description: "result 层 1h 命中率较 24h 基线相对跌幅超阈值（阈值=Nacos alert.cache-hit-drop-ratio），请检查缓存版本号变更/last-hash 失效是否过频。"

  # ==========================================================================
  # 批次九 9.9-C：search 模块可观测告警（指标来源 SearchMetrics，counter 已按 Prometheus 约定补 _total）
  # 首版比例阈值与 for 时长先跑 1~2 周观察基线，再按实际流量收紧
  # ==========================================================================
  - name: litisle-search
    rules:
      # ① 索引同步死信新增：重试耗尽入 DLQ，必须人工重投（阈值 0=任一新增即告警）
      - alert: SearchIndexDlqNew
        expr: increase(litisle_search_index_dlq_total[10m]) > 0
        for: 0m            # 窗口内已含 10 分钟增量，无需额外等待
        labels:
          severity: critical
        annotations:
          summary: "[{{ $labels.application }}] 索引同步死信新增 {{ $value }} 条"
          description: "近 10 分钟出现重试耗尽入 DLQ 的消息（originQueue={{ $labels.originQueue }}），索引可能未同步，请按日志人工重投并排查 ES/content 故障。"

      # ② ES 异常率：ES 查询异常 / 检索请求 > 5% 持续 10 分钟，说明检索主链路不可用（分母为 0 时 NaN 不触发）
      - alert: SearchEsErrorRateHigh
        expr: sum by (application) (rate(litisle_search_es_errors_total[5m])) / sum by (application) (rate(litisle_search_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "[{{ $labels.application }}] ES 查询异常率 {{ $value | humanizePercentage }} 持续超阈"
          description: "5 分钟窗口 ES 异常占检索请求超 5% 且持续 10 分钟，请检查 ES 集群健康/索引状态/查询超时，必要时确认降级链路是否生效。"

      # ③ 检索降级占比：source=DEGRADED 请求占比 > 20% 持续 10 分钟，说明 ES 长时间不可用但降级在兜底
      - alert: SearchDegradedRatioHigh
        expr: sum by (application) (rate(litisle_search_requests_total{outcome="degraded"}[10m])) / sum by (application) (rate(litisle_search_requests_total[10m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.application }}] 检索降级占比 {{ $value | humanizePercentage }} 持续升高"
          description: "10 分钟窗口返回 DEGRADED（ES 不可用热门兜底）占比超 20%，检索质量已下降，请优先恢复 ES 并关注热门兜底缓存命中。"

      # ④ 热度刷写失败率：failure 条目占比 > 10% 持续 15 分钟，热度排序会逐步陈旧（热度非核心链路，warning）
      - alert: SearchHeatFlushFailureHigh
        expr: sum by (application) (rate(litisle_search_heat_flush_docs_total{result="failure"}[15m])) / sum by (application) (rate(litisle_search_heat_flush_docs_total[15m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.application }}] 热度刷写失败率 {{ $value | humanizePercentage }} 持续超阈"
          description: "15 分钟窗口热度批量刷写失败条目占比超 10%，热度排序将滞后；请检查 ES bulk 写入与 Redis 热度键读取。"

      # ⑤ 缓存合并失效失败：脏标记驱动的热点缓存失效执行失败，旧结果可能继续返回（阈值 0=任一失败即告警）
      - alert: SearchCacheEvictMergeFailure
        expr: increase(litisle_search_cache_evict_merge_total{result="failure"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.application }}] 热点查询缓存合并失效失败 {{ $value }} 次"
          description: "15 分钟窗口出现合并失效执行失败（脏标记已置位但 evictAll 未成功），热点查询可能返回旧结果；请检查 Redis 连通性，下一轮会自动重试。"

      # ⑥ 索引同步队列积压：任一队列消息数 > 20 且持续 5 分钟 → 消费能力不足（ES 写入慢 / content 回查慢 / 消费者卡住）
      #   口径选择「按 queue 分组取单队列最大值」而非全局求和：单队列卡死本身就构成积压风险，
      #   全局求和在多队列各自十几条瞬时消息时容易凑数误报；保留 queue 标签便于直接定位队列。
      #   样本缺失说明：gauge 依赖采集任务成功读取 MQ，采集失败时该指标无样本，
      #   规则表现为 no data（不触发、不误报）；若要侦测「采集器自身失效」需另配 absent() 规则，本批未纳入。
      - alert: SearchIndexBacklogHigh
        expr: max by (application, queue) (litisle_search_index_backlog) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.application }}] 索引队列 {{ $labels.queue }} 积压 {{ $value }} 条"
          description: "队列 {{ $labels.queue }} 消息数持续 5 分钟超过 20 条，说明索引同步消费跟不上生产；请查看该队列消费日志与 ES 写入耗时、content 回查接口是否异常，必要时临时提高监听器并发或扩容 search 实例。"

  # ==========================================================================
  # 批次十：content 推荐流可观测告警（指标来源 ContentMetrics，counter 已按 Prometheus 约定补 _total）
  # 阈值先按当前量级保守取值，跑 1~2 周观察基线后再收紧
  # 采样纪律：表达式不做 or 0 / 默认值填充；采集缺失时为 no data（不触发），不掩盖采集失效
  # ==========================================================================
  - name: litisle-content
    rules:
      # ① 推荐流降级速率过高：10 分钟窗口降级速率 > 0.5 次/秒（约 30 次/分钟）且持续 10 分钟。
      #   触发含义：Redis 不可用 / last-good 兜底 / 热度榜为空 / 建池失败任一原因持续发生，
      #   推荐质量已由兜底链路接管，需按 reason 标签定位 Redis、热度榜灌榜任务或快照写入。
      - alert: ContentFeedDegradedRateHigh
        expr: sum by (application) (rate(litisle_content_feed_degraded_total[10m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.application }}] 推荐流降级速率 {{ $value }}/s 持续偏高"
          description: "近 10 分钟推荐流降级速率持续超过 0.5 次/秒；请按 reason（redis-down/last-good/hot-empty/build-failed）与 stream（article/book）标签定位 Redis 连通性、热度榜灌榜任务、快照写入是否正常。"

      # ② Redis 不可用降级新增：区别于 last-good 兜底，属于真实缓存层故障 → critical（任一新增即告警）
      - alert: ContentFeedRedisDown
        expr: increase(litisle_content_feed_degraded_total{reason="redis-down"}[10m]) > 0
        for: 0m           # 窗口内已含 10 分钟增量，无需额外等待
        labels:
          severity: critical
        annotations:
          summary: "[{{ $labels.application }}] 推荐流 Redis 不可用 {{ $value }} 次"
          description: "近 10 分钟出现 reason=redis-down 降级（stream={{ $labels.stream }}），推荐流已退回实时一页；请检查 Redis（compose: litisle-redis / 6380）连通性与网络。"