litisle:
  # ================================
  # Nacos 配置（Docker 环境：使用容器名）
  # 容器名：litisle-nacos，容器内端口 8848
  # ================================
  nacos:
    server-addr: litisle-nacos:8848
    username: nacos
    password: nacos
    namespace: ''
    group: DEFAULT_GROUP

  # ================================
  # MySQL 配置（Docker 环境：使用容器名）
  # 容器名：litisle-mysql，容器内端口 3306
  # ================================
  db:
    host: litisle-mysql
    port: 3306
    database: litisle_review
    username: test_k.1
    password: ${COMPOSE_MYSQL_PASSWORD:123}

  # ================================
  # Redis 配置（Docker 环境：使用容器名）
  # 容器名：litisle-redis，容器内端口 6379
  # ================================
  redis:
    host: litisle-redis
    port: 6379
    password: ${COMPOSE_REDIS_PASSWORD:123}

  # ================================
  # RabbitMQ 配置（Docker 环境：使用容器名）
  # 容器名：litisle-rabbitmq，容器内端口 5672；账号/vhost 见 definitions.json
  # ================================
  rabbitmq:
    host: litisle-rabbitmq
    port: 5672
    username: litisle
    password: litisle_pass
    vhost: /litisle

  # ================================
  # 机审提供方（启动自检：ModerationProviderStartupChecker）
  # image-provider=none：NSFW 模型文件落位前显式禁用（启动有 WARN 告警属预期）；
  # 模型落位后改为 onnx 即启用。生产环境切 aliyun 走 Nacos 覆盖，零代码改动
  # ================================
  moderation:
    text-provider: llm
    image-provider: none
    onnx:
      model-path: ./models/nsfw-mobilenetv2.onnx
      timeout-ms: 10000
      reject-threshold: 0.80
      suspicious-threshold: 0.60