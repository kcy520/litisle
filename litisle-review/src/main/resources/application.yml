server:
  port: 8084

spring:
  application:
    name: litisle-review

  profiles:
    active: local

  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true

  # Nacos 配置中心 + 服务注册发现
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
      - optional:nacos:litisle-shared.yaml
  cloud:
    nacos:
      server-addr: ${litisle.nacos.server-addr:localhost:8848}
      username: ${litisle.nacos.username:nacos}
      password: ${litisle.nacos.password:nacos}
      discovery:
        namespace: ${litisle.nacos.namespace:}
        group: ${litisle.nacos.group:DEFAULT_GROUP}
      config:
        namespace: ${litisle.nacos.namespace:}
        group: ${litisle.nacos.group:DEFAULT_GROUP}
        file-extension: yaml

  # MySQL（litisle_review 库：review_task/report/appeal/punish_log/moderation_record 等）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${litisle.db.host:localhost}:${litisle.db.port:3306}/${litisle.db.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
    username: ${litisle.db.username:root}
    password: ${litisle.db.password:123}

  # Redis（审核结果缓存 / 拒传黑名单 / 免审键 / 在途去重锁）
  data:
    redis:
      host: ${litisle.redis.host:localhost}
      port: ${litisle.redis.port:6380}
      password: ${litisle.redis.password:123}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 0

  # RabbitMQ（moderation.exchange；服务端需延迟消息插件 x-delayed-message）
  rabbitmq:
    host: ${litisle.rabbitmq.host:localhost}
    port: ${litisle.rabbitmq.port:5672}
    username: ${litisle.rabbitmq.username:litisle}
    password: ${litisle.rabbitmq.password:litisle_pass}
    virtual-host: ${litisle.rabbitmq.vhost:/litisle}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 失败不 ACK 重投（延迟退避），故手动应答
        acknowledge-mode: manual
        # 预取上限外置（防一次拉取过多消息驻留内存 OOM，§4.7）
        prefetch: ${litisle.moderation.consumer.prefetch:10}

mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto

logging:
  level:
    com.litisle.litislereview: debug
    com.litisle.litisleapi.feign: DEBUG
  pattern:
    dateformat: HH:mm:ss:SSS
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{50} - %msg%n"
  file:
    path: "logs/${spring.application.name}"

# Actuator 监控端点（审核观测指标暴露给 Prometheus，§4.8）
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# litisle-review 业务配置（外置清单见 Review-Plan §4.7；运营可调）
litisle:
  moderation:
    # 适配器激活（生产切 aliyun 零代码）
    text-provider: llm
    image-provider: onnx
    # NLM 语义机审提供方（批次1 ⑦ 预留键）：默认空=未激活，激活前无任何链路消费此键（纯占位）；
    #   二期接线位置=异步层（moderation.spi 适配器，与 LLM 并列/级联），走同一 @ConditionalOnProperty
    #   + 启动自检 fail-fast 三件套激活；⚠️ 禁进同步闸门（同步层本地毫秒级执行是硬约束，
    #   NLM 语义模型必然远程调用，只允许出现在异步机审链路）
    nlm-provider: ""
    retry:
      max-count: 5
      base-delay-ms: 30000
    cache:
      # 默认值归 litisle-shared.yaml（§4.7 跨服务共享，与 last-hash.ttl-hours 对齐防口径漂移）；
      # 本地值仅作环境特定覆盖用，Nacos 导入后以共享值为准
      ttl-hours: 72
      ttl-jitter-ratio: 0.1
    # last-hash.ttl-hours 归属 litisle-shared.yaml（content 写、review 声明），不放单服务 yml（§4.7）
    reject-blacklist:
      # 已绑定 ModerationProperties.RejectBlacklist 组（7-4.2）；默认值归 litisle-shared.yaml
      #   （§4.7 共享口径），本地值仅作环境特定覆盖；消费点（REJECT 落黑名单写入 TTL）随图片拒绝链路接线
      ttl-days: 30
    qps:
      # 语义层全站 QPS 护栏（Redis 降级直调模型时仍生效）
      max-count: 200
    consumer:
      prefetch: 10
    wordlib:
      # 灰度误报率阈值（MID→HIGH 转正量化门槛，误报率=误报上报次数/命中观察量）：已绑定
      #   ModerationProperties.Wordlib.grayMisreportRate；消费点=词库列表建议标记（§5.4 治理建议清单，
      #   HIGH 词样本足够且误报率低于该值出「转正确认」标记）；仅证据参考、禁自动动作
      gray-misreport-rate: 0.01
      # 建议标记最小命中样本量（ModerationProperties.Wordlib.minHitSample）：命中观察量达到该值
      #   才参与「转正确认/建议转正」标记计算（样本不足不标记）；HIGH 降级建议以误报绝对量为主不走本门槛
      min-hit-sample: 50
      # DFA 词库本地持久化快照目录（表加载失败/为空时回退上次成功词库，§4.4.4 宁严勿松）
      snapshot-dir: ${user.home}/.litisle/review/dfa-snapshot
      backup:
        # 词库冷备（批次1 ①）：LocalGzipBackupStore 激活开关——显式置 true 才注册 Bean
        #   （@ConditionalOnProperty，代码默认关=纯新增不改变现网行为）；与快照角色互补：
        #   Redis 快照=热备（仅最新版，冷启动兜底），备份文件=冷备（版本化全保留、可人工恢复）
        enabled: true
        # ⚠️ 备份根目录：必须是挂载持久卷（容器化部署下容器本地盘随实例销毁，备份会丢）；
        #   文件布局 {dir}/{scene}/{scene}-v{version}.csv.gz；恢复走人工 runbook（禁自动回滚），
        #   回灌必须经既有词库导入入口（validateWord 限长+字符校验链自动生效，防污染备份绕过校验回灌）
        dir: ${user.home}/.litisle/review/wordlib-backup
        # 每 scene 保留最近 N 个版本备份，落盘后自动清理更旧版本文件（非正数=保留全版本）
        retention-versions: 50
      misreport:
        # 词库误报记录保留天数（wordlib_misreport 误报明细表）：超过保留期未再上报的行由
        #   WordlibMisreportCleanupSweeper 天级 05:00 清理；非正数=保留全量（清理关闭）。
        #   误报属运营数据非合规硬凭证（区别于 moderation_record ≥6 月留痕），聚合结论已沉淀
        #   在灰度转正裁决里，过期可删
        retention-days: 180
    appeal: 
      # ⚠️ 本组不绑定（7-4.2 口径收敛决策）：timeout-days 与 sweeper.appeal-timeout-days
      #   （6-1.2 已落地消费）口径重复，统一读 sweeper 组防双源漂移，本项永远不生效保留备查；
      #   window-days（申诉窗口期）消费点随申诉创建链路（板块五）实现，届时确需可调再绑定
      window-days: 7
      timeout-days: 7
    report:
      # 已绑定 ModerationProperties.Report 组（7-4.2）；消费点（人审 decide 判诬告后
      #   累计反向处罚）随板块五 decideTask 实现接线
      abuse-threshold: 3
    claim:
      # max-active-per-reviewer 已绑定 ModerationProperties.Claim 组（7-4.2）；
      #   消费点（认领配额校验）随板块五 claimTask 实现接线；
      # timeout-minutes ⚠️ 本项不绑定：口径已收敛至 sweeper.claim-timeout-minutes
      #   （7-3 决策，勿在此重复定义），本项永远不生效保留备查
      timeout-minutes: 30
      max-active-per-reviewer: 20
    quarantine:
      retention-days: 10
    record:
      # 归档任务二期启用开关（ModerationRecordArchiveSweeper 占位类注册闸，显式置 true 才激活；retention-months 见 §4.4.1 合规下限）
      archive-enabled: false
      retention-months: 6
      # 归档单轮批量上限（最老优先按 id 区间推进，防单轮长事务）
      batch-limit: 500
      # 归档互斥锁时长（秒），天级 04:00 调度（archive-cron 默认 0 0 4 * * ?，与 quarantine 清扫 03:00 错峰）
      lock-seconds: 300
    sweeper:
      interval-seconds: 60
      stuck-resubmit-minutes: 30
    llm:
      temperature: 0
      few-shot-version: v1
      timeout-ms: 15000
      max-text-chars: 6000
    onnx:
      timeout-ms: 10000
      # 本地推理并发上限（信号量，默认 CPU 核数）
      max-concurrency: 4
      # 本地模型文件路径（ONNX 适配器构造期加载，缺失/损坏直接启动失败 fail-fast）
      # ⚠️ 请改成你本地实际存放 nsfw 模型文件的绝对/相对路径，否则 image-provider=onnx 时启动失败
      model-path: models/nsfw-mobilenetv2.onnx
    api:
      timeout-ms: 8000
    image:
      model-version: v1
    dedup:
      lock-seconds: 60
    reconcile:
      # 处罚双向对账 sweeper（5-3.2）：cron 由 @Scheduled 占位符直读（默认 0 */10 * * * ? 每 10 分钟一轮）
      cron: 0 */10 * * * ?
      revoke-lookback-days: 7
      batch-limit: 500
      lock-seconds: 300
    alert:
      suspicious-backlog-threshold: 50
      dlq-backlog-threshold: 100
      moderation-fail-rate: 0.2
      pass-rate-drop-ratio: 0.3
      cache-hit-drop-ratio: 0.5

knife4j:
  enable: true
  openapi:
    title: litisle-review 接口文档
    description: "Litisle-review：内容审核 / 举报 / 申诉 / 处罚 / 词库运营"
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.litisle.litislereview.controller
