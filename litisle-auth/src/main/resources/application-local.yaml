spring:
  cloud:
    sentinel:
      transport:
        # 本地心跳端口（auth 固定 8719；user 同机部署用 8720 错开）
        port: 8719
      # Sentinel 规则 Nacos 数据源（同 file 模块说明）：规则外置 Nacos、热更新、重启不丢
      datasource:
        degrade-rules:
          nacos:
            server-addr: ${litisle.nacos.server-addr}
            username: ${litisle.nacos.username}
            password: ${litisle.nacos.password}
            data-id: litisle-auth-degrade-rules.json
            group-id: DEFAULT_GROUP
            rule-type: degrade

litisle:
  # ================================
  # Sentinel 配置（本地环境）
  # transport.port：与 Dashboard 的心跳/通信端口，同机多服务需错开
  # （dashboard 地址在 Nacos 共享配置 litisle-shared.yaml 统一维护）
  # ================================
  # ================================
  # Nacos 配置（本地环境：宿主机映射端口 8848）
  # ================================
  nacos:
    server-addr: localhost:8848
    username: nacos
    password: nacos
    namespace: ''
    group: DEFAULT_GROUP

  # ================================
  # Redis 配置（IDEA 本地运行：使用宿主机映射端口）
  # 注意：docker-compose.yml 中 Redis 宿主机端口是 6380
  # ================================
  redis:
    host: localhost
    port: 6380
    password: ${COMPOSE_REDIS_PASSWORD:123}
  mail:
    from: ${MAIL_FROM:}
    password: ${MAIL_AUTH_CODE:}

  # ================================
  # 安全加密配置（本地开发环境使用硬编码密钥，排除环境变量干扰）
  # ================================
  security:
    crypto:
      # 本地开发直接写入合法 Base64 密钥，不通过占位符
      # 生产环境使用主 application.yml 的 ${LITISLE_CRYPTO_KEY} 从环境变量注入
      key: RT6uWj/AaWAJ9/dm3l1aBzEHackhrujBqMeAkiKaaac=