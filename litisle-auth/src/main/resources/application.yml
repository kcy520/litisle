server:
  port: 8082

spring:
  application:
    name: litisle-auth

  profiles:
    active: local

  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true

  # ================================
  # Nacos 配置中心 + 服务注册发现
  # ================================
  config:
    import:
      # 服务专属配置（Data ID: litisle-auth.yaml）
      #optional: 前缀的作用：如果 Nacos 里还没有这个配置，服务不会启动失败，只是跳过拉取。所以现在即使没创建，auth/user 也能正常启动和互相调用。
      - optional:nacos:${spring.application.name}.yaml
      # 公共共享配置模板-抽取到nacos的共享配置（Data ID: litisle-shared.yaml，与 common 模块无关）
      - optional:nacos:litisle-shared.yaml
  cloud:
    nacos:
      # 连接信息：环境特定值在 application-local/dev.yaml 的 litisle.nacos 中定义
      server-addr: ${litisle.nacos.server-addr:localhost:8848}
      username: ${litisle.nacos.username:nacos}
      password: ${litisle.nacos.password:nacos}
      discovery:
        namespace: ${litisle.nacos.namespace:}
        group: ${litisle.nacos.group:DEFAULT_GROUP}
      config:
        namespace: ${litisle.nacos.namespace:}
        group: ${litisle.nacos.group:DEFAULT_GROUP}
        file-extension: yaml


  # ================================
  # Redis 单机配置
  # ================================
  data:
    redis:
      host: ${litisle.redis.host:localhost}
      port: ${litisle.redis.port:6380}
      password: ${litisle.redis.password:123}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 0

  mail:
    # 发送者邮箱（与 username 一致）
    username: ${litisle.mail.from:}
    from: ${litisle.mail.from:}
    # 邮箱授权码（非登录密码，QQ邮箱需在设置中获取）
    password: ${litisle.mail.password:}

    # SMTP 服务器地址
    host: smtp.qq.com
    # 端口：SSL 用 465（推荐），TLS 用 587
    port: 465
    # 协议统一用 smtp，SSL 在 properties 中开启（更稳）
    protocol: smtp

    # 默认邮件编码
    default-encoding: UTF-8

    # SMTP / SSL 高级配置（QQ邮箱专用）
    properties:
      mail:
        smtp:
          # 开启登录认证
          auth: true
          # 开启 SSL（465 必须）
          ssl.enable: true
          # 兼容老 JDK 的 SSL Socket 工厂
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
          # 调试模式，开发阶段开着很香
          debug: true


  # ================================
  # Redis 集群配置
  # ================================
  # data:
  #   redis:
  #     cluster:
  #       nodes:
  #         - redis-node1:6379
  #         - redis-node2:6379
  #         - redis-node3:6379
  #         - redis-node4:6379
  #         - redis-node5:6379
  #         - redis-node6:6379
  #       max-redirects: 3
  #     password: ${litisle.redis.password:123}
  #     lettuce:
  #       pool:
  #         max-active: 200
  #         max-wait: -1ms
  #         max-idle: 10
  #         min-idle: 0


litisle:
  # ===== 邮箱配置（业务层）=====
  mail:
    # from 在 spring.mail 里已复用，这里仅作语义收口
    from: ${litisle.mail.from:}
    password: ${litisle.mail.password:}

  # ===== 验证码配置（CaptchaProperties 绑定）=====
  captcha:
    # 图形验证码 TTL（秒）：3 分钟
    img-ttl: 180
    # 邮箱验证码 TTL（秒）：5 分钟
    email-ttl: 300
    # 防刷窗口 TTL（秒）：1 分钟
    limit-ttl: 60
    # 每分钟最大发送次数
    limit-max: 5
    # 邮箱验证码连续校验失败上限（防穷举爆破）
    max-verify-fails: 3

  # ===== 认证模块配置（AuthProperties 绑定）=====
  auth:
    # Refresh Token 有效期（秒），默认 7 天（604800 秒）
    refresh-token-expire: 604800

# ================================
# 安全加密配置（common-security）
# ================================
# AES-256-GCM：用于手机号/邮箱加密存储，auth 模块同样需要
  security:
    crypto:
      # AES-256 密钥（Base64 编码的 32 字节密钥）
      # 生产环境、开发/本地环境均通过环境变量注入或回退默认密钥
      # 生产环境通过环境变量 LITISLE_CRYPTO_KEY 注入（占位符优先取环境变量）
      key: ${LITISLE_CRYPTO_KEY:RT6uWj/AaWAJ9/dm3l1aBzEHackhrujBqMeAkiKaaac=}
      # BCrypt 强度因子（默认 10，范围 4-31，每+1 计算量翻倍）
      bcrypt-cost: 10

sa-token:
  # Token 名称
  token-name: Authorization
  # Token 前缀
  token-prefix: Bearer
  # JWT 密钥（替换 JwtTokenProvider 的 secret）
  jwt-secret-key: ${LITISLE_JWT_SECRET:your-32-character-jwt-secret-key}
  # Token 有效期（秒，默认 7 天）
  timeout: 86400
  # 记住我模式有效期（秒）
  active-timeout: 604800
  # 是否允许同一账号多端登录
  is-concurrent: true
  # 同一账号最大登录数量（-1 = 不限）
  max-login-count: 2
  # 是否开启 Token 认证
  is-write-header: true
  # 是否输出操作日志
  is-log: true
  # 配置 Sa-Token 的 SSO 或 Same-Token 等

# OAuth2 第三方登录配置
justauth:
  enabled: true
  type:
    WECHAT_OPEN:
      client-id: ${WECHAT_OPEN_APP_ID}
      client-secret: ${WECHAT_OPEN_APP_SECRET}
      redirect-uri: https://your-domain.com/v1/auth/oauth2/WECHAT_OPEN/callback
    QQ:
      client-id: ${QQ_APP_ID}
      client-secret: ${QQ_APP_KEY}
      redirect-uri: https://your-domain.com/v1/auth/oauth2/QQ/callback
    GITHUB:
      client-id: ${GITHUB_CLIENT_ID}
      client-secret: ${GITHUB_CLIENT_SECRET}
      redirect-uri: https://your-domain.com/v1/auth/oauth2/GITHUB/callback

# ====== 日志配置 ======
logging:
  pattern:
    # 控制台日志格式（%X{traceId} 输出链路追踪 ID）
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{50} - %msg%n"
  level:
    # Feign 客户端日志（配合 FeignApiConfig 的 Logger.Level.BASIC 才会输出请求方法/URL/状态码/耗时）
    com.litisle.litisleapi.feign: DEBUG

# ================================
# Knife4j API 文档配置
# ================================
knife4j:
  enable: true
  openapi:
    title: litisle-auth 接口文档
    description: "Litisle-auth"
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.litisle.litisleauth.controller