# ====================================================================
# LitIsle 网关配置
# ====================================================================

# ====== 服务配置 ======
server:
  port: 8080

spring:
  application:
    name: litisle-gateway

  main:
    # WebFlux 应用，不允许存在 WebMVC 的冲突 Bean
    web-application-type: reactive

  cloud:
    gateway:
      # 全局默认过滤器
      default-filters:
        # 移除响应头中的 Server 信息（安全加固）
        - RemoveResponseHeader=Server
        - RemoveResponseHeader=X-Powered-By

      routes:
        # ---------- 认证服务 ----------
        - id: litisle-auth
          uri: lb://litisle-auth
          predicates:
            - Path=/api/auth/**

        # ---------- 用户服务 ----------
        - id: litisle-user
          uri: lb://litisle-user
          predicates:
            - Path=/api/user/**

        # ---------- 内容服务 ----------
        - id: litisle-content
          uri: lb://litisle-content
          predicates:
            - Path=/api/content/**

        # ---------- 社交服务 ----------
        - id: litisle-social
          uri: lb://litisle-social
          predicates:
            - Path=/api/social/**

        # ---------- 支付服务 ----------
        - id: litisle-payment
          uri: lb://litisle-payment
          predicates:
            - Path=/api/payment/**

        # ---------- 商城服务 ----------
        - id: litisle-shop
          uri: lb://litisle-shop
          predicates:
            - Path=/api/shop/**

        # ---------- 审核服务 ----------
        - id: litisle-review
          uri: lb://litisle-review
          predicates:
            - Path=/api/review/**

        # ---------- 文件服务 ----------
        - id: litisle-file
          uri: lb://litisle-file
          predicates:
            - Path=/api/file/**

        # ---------- AI 服务 ----------
        - id: litisle-ai
          uri: lb://litisle-ai
          predicates:
            - Path=/api/ai/**

        # ---------- 通知服务 ----------
        - id: litisle-notification
          uri: lb://litisle-notification
          predicates:
            - Path=/api/notification/**

        # ---------- 搜索服务 ----------
        - id: litisle-search
          uri: lb://litisle-search
          predicates:
            - Path=/api/search/**

# ====== Sa-Token 认证配置（替代原 JWT 配置） ======
# 【重要】网关需要引入 sa-token-reactor-spring-boot3-starter 依赖（WebFlux 专用）
# 【说明】网关通过 Sa-Token JWT 模式无状态校验 Token，提取用户信息注入下游请求 Header
sa-token:
  # Token 名称
  token-name: Authorization
  # Token 前缀
  token-prefix: Bearer
  # JWT 密钥（HMAC-SHA256，至少 256 bit = 32 字符）
  # 生产环境通过环境变量 LITISLE_JWT_SECRET 注入，禁止硬编码
  jwt-secret-key: ${LITISLE_JWT_SECRET:LitIsle-Default-JWT-Secret-Key-Change-In-Production!}
  # Token 有效期（秒），默认 30 分钟
  timeout: 1800
  # 记住我模式有效期（秒），默认 7 天
  active-timeout: 604800
  # 是否输出操作日志
  is-log: true

litisle:
  gateway:
    jwt:    # ====== 匿名访问白名单 ======
      # 【说明】这些路径跳过 JWT 校验，直接放行
      # 与 GatewayJwtProperties 绑定的前缀 litisle.gateway.jwt 保持一致
      # 【拦截逻辑】SaReactorFilter 拦截所有路径（addInclude("/**")），
      # 仅放行下方白名单，其余路径一律要求登录（StpUtil.checkLogin()）
      paths:
        # ---------- 认证服务（无需登录） ----------
        - /api/auth/login            # 账号密码登录
        - /api/auth/register         # 注册
        - /api/auth/captcha/image    # 图形验证码
        - /api/auth/captcha/email    # 邮箱验证码
        - /api/auth/oauth/**         # OAuth2 第三方登录
        - /api/auth/refresh          # 刷新 Token

        # ---------- 内容服务（公开内容） ----------
        - /api/content/article/list  # 公开文章列表
        - /api/content/article/{id}  # 公开文章详情
        - /api/content/article/hot   # 热门文章
        - /api/content/category/**   # 文章分类列表

        # ---------- 用户服务（公开信息） ----------
        - /api/user/public/**        # 公开用户信息（作者主页等）

        # ---------- 搜索服务 ----------
        - /api/search/**             # 公开搜索

        # ---------- 文件服务 ----------
        - /api/file/download/**      # 公开文件下载

        # ---------- 健康检查 ----------
        - /actuator/**               # 健康检查（生产环境需限制）

# ====== 日志配置 ======
logging:
  level:
    com.litisle.litislegateway: DEBUG
    com.litisle.commoncore: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{50} - %msg%n"