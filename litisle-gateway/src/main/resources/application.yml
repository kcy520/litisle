# ====================================================================
# LitIsle 网关配置
# ====================================================================

# ====== 服务配置 ======
server:
  port: 8080

spring:
  application:
    name: litisle-gateway

  main:
    # WebFlux 应用，不允许存在 WebMVC 的冲突 Bean
    web-application-type: reactive

  # Nacos 配置中心共享配置（sa-token 公共段统一从此读取）
  # optional：Nacos 未就绪时跳过拉取，不阻塞启动
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
      - optional:nacos:litisle-shared.yaml

  # Redis（必须与 auth/user 同一实例：当前体系为 Redis 共享会话模式，网关校验 token 需读同一份会话）
  data:
    redis:
      host: ${litisle.redis.host:localhost}
      port: ${litisle.redis.port:6380}
      password: ${litisle.redis.password:123}
      database: 0

  cloud:
    # Nacos 注册中心（lb:// 路由依赖服务发现，配置模式与业务模块一致）
    nacos:
      server-addr: ${litisle.nacos.server-addr:localhost:8848}
      username: ${litisle.nacos.username:nacos}
      password: ${litisle.nacos.password:nacos}
      discovery:
        namespace: ${litisle.nacos.namespace:}
        group: ${litisle.nacos.group:DEFAULT_GROUP}
    gateway:
      # 全局默认过滤器
      default-filters:
        # 移除响应头中的 Server 信息（安全加固）
        - RemoveResponseHeader=Server
        - RemoveResponseHeader=X-Powered-By

      routes:
        # ---------- 认证服务 ----------
        - id: litisle-auth
          uri: lb://litisle-auth
          predicates:
            - Path=/api/auth/**

        # ---------- 用户服务 ----------
        - id: litisle-user
          uri: lb://litisle-user
          predicates:
            - Path=/api/user/**

        # ---------- 内容服务 ----------
        - id: litisle-content
          uri: lb://litisle-content
          predicates:
            - Path=/api/content/**

        # ---------- 社交服务 ----------
        - id: litisle-social
          uri: lb://litisle-social
          predicates:
            - Path=/api/social/**

        # ---------- 支付服务 ----------
        - id: litisle-payment
          uri: lb://litisle-payment
          predicates:
            - Path=/api/payment/**

        # ---------- 商城服务 ----------
        - id: litisle-shop
          uri: lb://litisle-shop
          predicates:
            - Path=/api/shop/**

        # ---------- 审核服务内部契约拦截（安全项，5-2.4） ----------
        # /api/review/punish/status 为服务间内部契约端点（处罚权威态回查），
        # 公网登录用户直查可探测任意用户处罚态（信息泄露面），显式拦截返回 404 不暴露端点存在性；
        # 置于 litisle-review 前缀路由之前确保优先命中
        - id: block-review-punish-status
          uri: no://op
          predicates:
            - Path=/api/review/punish/status
          filters:
            - SetStatus=404

        # ---------- 审核服务 ----------
        - id: litisle-review
          uri: lb://litisle-review
          predicates:
            - Path=/api/review/**

        # ---------- 文件服务 ----------
        - id: litisle-file
          uri: lb://litisle-file
          predicates:
            - Path=/api/file/**

        # ---------- AI 服务 ----------
        - id: litisle-ai
          uri: lb://litisle-ai
          predicates:
            - Path=/api/ai/**

        # ---------- 通知服务 ----------
        - id: litisle-notification
          uri: lb://litisle-notification
          predicates:
            - Path=/api/notification/**

        # ---------- 搜索服务 ----------
        - id: litisle-search
          uri: lb://litisle-search
          predicates:
            - Path=/api/search/**

# ====== Sa-Token 认证配置（替代原 JWT 配置） ======
# 【重要】网关需要引入 sa-token-reactor-spring-boot3-starter 依赖（WebFlux 专用）sa-token:
  # Token 名称
  token-name: Authorization
  # Token 前缀
  token-prefix: Bearer
  # Token 有效期（秒），必须与 auth 一致（86400）
  timeout: 86400
  # 记住我模式有效期（秒），必须与 auth 一致
  active-timeout: 604800
  # 允许同一账号多端登录（与 auth 一致）
  is-concurrent: true
  # 同一账号最大登录数量（与 auth 一致）
  max-login-count: 2
  # 开启 Token 认证（写入/读取请求头，与 auth 一致）
  is-write-header: true
  # 是否输出操作日志
  is-log: true

litisle:
  gateway:
    jwt:    # ====== 匿名访问白名单 ======
      # 【说明】这些路径跳过 JWT 校验，直接放行
      # 与 GatewayJwtProperties 绑定的前缀 litisle.gateway.jwt 保持一致
      # 【拦截逻辑】SaReactorFilter 拦截所有路径（addInclude("/**")），
      # 仅放行下方白名单，其余路径一律要求登录（StpUtil.checkLogin()）
      paths:
        # ---------- 认证服务（无需登录） ----------
        - /api/auth/login            # 账号密码登录
        - /api/auth/register         # 注册
        - /api/auth/captcha/image    # 图形验证码
        - /api/auth/captcha/email    # 邮箱验证码
        - /api/auth/oauth/**         # OAuth2 第三方登录
        - /api/auth/refresh          # 刷新 Token

        # ---------- 内容服务（公开内容） ----------
        - /api/content/article/list  # 公开文章列表
        - /api/content/article/*     # 公开文章详情（Sa-Token 匹配器不支持 Spring 的 {id} 语法，改用 * 通配）
        - /api/content/article/hot   # 热门文章
        - /api/content/category/**   # 文章分类列表
        # 书籍阅读三读端点（阶段17；Sa-Token 用 * 单段通配，不支持 Spring {id} 语法）
        - /api/content/book/*          # 书籍详情（匿名可读公开书籍）
        - /api/content/book/*/chapters # 章节列表
        - /api/content/book/*/chapter/* # 章节详情
        # 【安全项】白名单只跳过网关 JWT 校验；书籍写端点（PUT/DELETE/POST chapter）
        # 仍由 Controller @SaCheckLogin + Service owner 校验保护，通配不放宽写权限
        # 注意：/api/content/book/* 会覆盖 /api/content/book/xxx 一层路径，
        # 但不会覆盖 /api/content/book/xxx/chapters 等多层路径（各条目已单独列出）

        # ---------- 用户服务（公开信息） ----------
        - /api/user/public/**        # 公开用户信息（作者主页等）

        # ---------- 搜索服务 ----------
        # 公开检索/联想/相似推荐匿名放行；/api/search/history 需登录（user_id 硬收口，批次四 4.3）
        # Sa-Token 匹配器用 * 单段通配，不支持 Spring {id} 语法，故相似推荐用 ** 覆盖多层路径
        - /api/search                 # 公开全文检索（GET /api/search）
        - /api/search/suggest         # 搜索联想（批次六）
        - /api/search/similar/**      # 相似推荐（批次七）
        # 注意：/api/search/history 故意不列入白名单，由登录态取当前用户 ID，防越权查询他人历史

        # ---------- 文件服务 ----------
        - /api/file/download/**      # 公开文件下载

        # 【安全项】/actuator/** 不放行：
        # Prometheus 直连各服务端口抓取指标，不经网关；网关自身未引 actuator 依赖，
        # 路由表也无 /actuator 匹配——白名单若保留，将来网关引 actuator 或加 /actuator
        # 路由时，健康/指标端点将免登录裸奔到公网，故显式不放行。

# ====== 日志配置 ======
logging:
  level:
    com.litisle.litislegateway: DEBUG
    com.litisle.commoncore: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{50} - %msg%n"