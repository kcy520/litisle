litisle:
  # ================================
  # MySQL 配置（宿主机本地裸装 MySQL）
  # ================================
  db:
    host: localhost
    port: 3306
    database: litisle_db
    username: root
    password: ${DB_PASSWORD}

  # ================================
  # Redis 配置（宿主机本地裸装 Redis）
  # ================================
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD}