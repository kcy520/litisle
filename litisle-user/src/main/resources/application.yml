server:
  port: 8081

spring:
  application:
    name: litisle-user

  profiles:
    active: local

  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true

  # ================================
  # Nacos 配置中心 + 服务注册发现
  # ================================
  config:
    import:
      # 服务专属配置（Data ID: litisle-user.yaml）
      - optional:nacos:${spring.application.name}.yaml
      # 公共共享配置模板（Data ID: litisle-shared.yaml，与 common 模块无关）
      - optional:nacos:litisle-shared.yaml
  cloud:
    nacos:
      # 连接信息：环境特定值在 application-local/dev.yaml 的 litisle.nacos 中定义
      server-addr: ${litisle.nacos.server-addr:localhost:8848}
      username: ${litisle.nacos.username:nacos}
      password: ${litisle.nacos.password:nacos}
      discovery:
        namespace: ${litisle.nacos.namespace:}
        group: ${litisle.nacos.group:DEFAULT_GROUP}
      config:
        namespace: ${litisle.nacos.namespace:}
        group: ${litisle.nacos.group:DEFAULT_GROUP}
        file-extension: yaml


  # ================================
  #  MySQL 数据源配置
  # ================================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 字符集：characterEncoding 用大写 UTF-8，并追加 connectionCollation 强制 utf8mb4，
    # 防止 Connector/J 8.x 回退到默认 latin1 导致中文乱码
    url: "jdbc:mysql://${litisle.db.host:localhost}:${litisle.db.port:3306}/${litisle.db.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
    username: ${litisle.db.username:root}
    password: ${litisle.db.password:123}

  # ================================
  # RabbitMQ 配置（批次五 B5：用户注册/资料更新事件发布，search 消费同步 user_idx）
  # ================================
  rabbitmq:
    host: ${litisle.rabbitmq.host:localhost}
    port: ${litisle.rabbitmq.port:5672}
    username: ${litisle.rabbitmq.username:litisle}
    password: ${litisle.rabbitmq.password:litisle_pass}
    virtual-host: ${litisle.rabbitmq.vhost:/litisle}

  # ================================
  # Redis 单机配置
  # ================================
  data:
    redis:
      host: ${litisle.redis.host:localhost}
      port: ${litisle.redis.port:6380}
      password: ${litisle.redis.password:123}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 0



  # ================================
  # Redis 集群配置
  # ================================
  # data:
  #   redis:
  #     cluster:
  #       nodes:
  #         - redis-node1:6379
  #         - redis-node2:6379
  #         - redis-node3:6379
  #         - redis-node4:6379
  #         - redis-node5:6379
  #         - redis-node6:6379
  #       max-redirects: 3
  #     password: ${litisle.redis.password:123}
  #     lettuce:
  #       pool:
  #         max-active: 200
  #         max-wait: -1ms
  #         max-idle: 10
  #         min-idle: 0

# ================================
# MyBatis ??
# ================================
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.litisle.user.entity

# ================================
# MyBatis-Plus 配置
# ================================
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto

# ================================
# 日志配置
# ================================
logging:
  level:
    com.litisle.user: debug
    com.litisle.litisleapi.feign: DEBUG
  pattern:
    dateformat: HH:mm:ss:SSS
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{50} - %msg%n"
  file:
    path: "logs/${spring.application.name}"

# ================================
# Actuator 监控端点（暴露 RedisGuard 指标给 Prometheus）
# ================================
management:
  endpoints:
    web:
      exposure:
        # health：健康检查；prometheus：指标抓取端点（RedisGuard 熔断降级指标数据源）
        include: health,prometheus
  metrics:
    tags:
      # 指标附加服务名标签，Prometheus 多服务区分数据来源
      application: ${spring.application.name}

# ================================
# 安全加密配置（common-security）
# ================================
# AES-256-GCM：用于手机号/邮箱加密存储
# BCrypt：用于密码哈希
litisle:
  security:
    crypto:
      # AES-256 密钥（Base64 编码的 32 字节密钥）
      # 生产环境通过环境变量 LITISLE_CRYPTO_KEY 注入（占位符优先取环境变量）
      # 本地/开发环境未设置环境变量时，回退使用下方默认密钥（Aes256GcmCrypto.generateKey() 生成）
      key: ${LITISLE_CRYPTO_KEY:RT6uWj/AaWAJ9/dm3l1aBzEHackhrujBqMeAkiKaaac=}
      # BCrypt 强度因子（默认 10，范围 4-31，每+1 计算量翻倍）
      bcrypt-cost: 10

# ================================
# Knife4j API 文档配置
# ================================
knife4j:
  enable: true
  openapi:
    title: litisle-user 接口文档
    description: "Litisle-user"
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.litisle.litisleuser.controller