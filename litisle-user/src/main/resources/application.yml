server:
  port: 8081

spring:
  application:
    name: litisle-social

  profiles:
    active: local-native

  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true


  # ================================
  # MySQL ?????
  # ================================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${litisle.db.host:localhost}:${litisle.db.port:3306}/${litisle.db.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${litisle.db.username:root}
    password: ${litisle.db.password:123}

  # ================================
  # Redis ??????
  # ================================
  data:
    redis:
      host: ${litisle.redis.host:localhost}
      port: ${litisle.redis.port:6379}
      password: ${litisle.redis.password:123}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 0



  # ================================
  # Redis ????????????
  # ================================
