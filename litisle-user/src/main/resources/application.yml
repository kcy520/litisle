server:
  port: 8081

spring:
  application:
    name: litisle-user

  profiles:
    active: local

  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true


  # ================================
  #  MySQL 数据源配置
  # ================================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${litisle.db.host:localhost}:${litisle.db.port:3306}/${litisle.db.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${litisle.db.username:root}
    password: ${litisle.db.password:123}

  # ================================
  # Redis 单机配置
  # ================================
  data:
    redis:
      host: ${litisle.redis.host:localhost}
      port: ${litisle.redis.port:6379}
      password: ${litisle.redis.password:123}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 0



  # ================================
  # Redis 集群配置
  # ================================
  # data:
  #   redis:
  #     cluster:
  #       nodes:
  #         - redis-node1:6379
  #         - redis-node2:6379
  #         - redis-node3:6379
  #         - redis-node4:6379
  #         - redis-node5:6379
  #         - redis-node6:6379
  #       max-redirects: 3
  #     password: ${litisle.redis.password:123}
  #     lettuce:
  #       pool:
  #         max-active: 200
  #         max-wait: -1ms
  #         max-idle: 10
  #         min-idle: 0

# ================================
# MyBatis ??
# ================================
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.litisle.user.entity

# ================================
# MyBatis-Plus 配置
# ================================
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto

# ================================
# 日志配置
# ================================
logging:
  level:
    com.litisle.user: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"

# ================================
# 安全加密配置（common-security）
# ================================
# AES-256-GCM：用于手机号/邮箱加密存储
# BCrypt：用于密码哈希
litisle:
  security:
    crypto:
      # AES-256 密钥（Base64 编码的 32 字节密钥，生产环境必须环境变量注入）
      # 生成方式：Aes256GcmCrypto.generateKey() 或在线工具生成 32 字节 Base64
      # 未配置时启动立即报错（Fail-Fast），不等到运行时才暴露
      key: ${LITISLE_CRYPTO_KEY}
      # BCrypt 强度因子（默认 10，范围 4-31，每+1 计算量翻倍）
      bcrypt-cost: 10

# ================================
# Knife4j API 文档配置
# ================================
knife4j:
  enable: true
  openapi:
    title: litisle-user 接口文档
    description: "Litisle-user"
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.litisle.user.controller