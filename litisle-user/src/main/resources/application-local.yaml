# ================================
# Sentinel 本地心跳端口
# 同机多服务需错开：auth 8719 / user 8720
# dashboard 地址在 Nacos 共享配置 litisle-shared.yaml 统一维护
# ================================
spring:
  cloud:
    sentinel:
      transport:
        port: 8720

litisle:
  # ================================
  # Nacos 配置（本地环境：宿主机映射端口 8848）
  # ================================
  nacos:
    server-addr: localhost:8848
    username: nacos
    password: nacos
    namespace: ''
    group: DEFAULT_GROUP

  # ================================
  # MySQL 配置（IDEA 本地运行：连宿主机映射端口）
  # 注意：docker-compose.yml 中业务数据库宿主机端口是 3307
  # ================================
  db:
    host: localhost
    port: 3307
    database: litisle_user
    username: test_k.1
    # ✅ 与 .env 中 COMPOSE_MYSQL_PASSWORD 保持一致
    password: ${COMPOSE_MYSQL_PASSWORD:123}

  # ================================
  # Redis 配置（IDEA 本地运行：使用宿主机映射端口）
  # 注意：docker-compose.yml 中 Redis 宿主机端口是 6380
  # ================================
  redis:
    host: localhost
    port: 6380
    password: ${COMPOSE_REDIS_PASSWORD:123}

  # ================================
  # 安全加密配置（本地开发使用硬编码密钥，排除环境变量干扰）
  # ================================
  security:
    crypto:
      # 本地开发直接写入合法 Base64 密钥，不通过占位符
      # 生产环境使用主 application.yml 的 ${LITISLE_CRYPTO_KEY} 从环境变量注入
      # 注意：若系统/IDE 中设置了 LITISLE_CRYPTO_KEY 环境变量，占位符会优先使用环境变量值
      # 因此开发环境直接硬编码，避免环境变量干扰
      key: RT6uWj/AaWAJ9/dm3l1aBzEHackhrujBqMeAkiKaaac=

