litisle:
  # ================================
  # MySQL 配置（IDEA 本地运行：连宿主机映射端口）
  # 注意：docker-compose.yml 中业务数据库宿主机端口是 3307
  # ================================
  db:
    host: localhost
    port: 3307
    database: litisle_db
    username: test_k.1
    # ✅ 与 .env 中 COMPOSE_MYSQL_PASSWORD 保持一致
    password: ${COMPOSE_MYSQL_PASSWORD:123}

  # ================================
  # Redis 配置（IDEA 本地运行：使用宿主机映射端口）
  # 注意：docker-compose.yml 中 Redis 宿主机端口是 6380
  # ================================
  redis:
    host: localhost
    port: 6380
    password: ${COMPOSE_REDIS_PASSWORD:123}

